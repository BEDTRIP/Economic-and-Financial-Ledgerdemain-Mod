# From localization/russian/01_ef_law_localization_l_russian.yml.
  lawgroup_bimetalism_ratio: "Биметаллическое соотношение"
  lawgroup_bimetalism_ratio_desc: "Определяет установленное законом соотношение конверсии между золотом и серебром в биметаллической денежной системе. Выбранное соотношение влияет на обращение монет, арбитраж, стабильность валюты и баланс между металлическими резервами. Несоответствие между юридическим соотношением и мировым рыночным соотношением может привести к исчезновению металлов из обращения или к переполнению монетного двора, вызывая денежные кризисы."
  law_bimetallic_ratio_no: "Без фиксированного соотношения"
  law_bimetallic_ratio_10: "Биметаллическое соотношение 10:1"
  law_bimetallic_ratio_15: "Биметаллическое соотношение 15:1"
  law_bimetallic_ratio_20: "Биметаллическое соотношение 20:1"
  law_bimetallic_ratio_no_desc: "Правительство не устанавливает фиксированного соотношения обмена между золотом и серебром. Чеканка следует рыночным оценкам, позволяя относительной цене обоих металлов свободно колебаться. Хотя это позволяет избежать арбитражных искажений, валюта становится более подверженной волатильности при расхождении цен на металлы."
  law_bimetallic_ratio_10_desc: "Золото юридически оценивается в десять раз дороже серебра. Это резко смещает предпочтение в пользу золота, стабилизируя валюту ценой вытеснения серебра из обращения. Исторически соотношение связано со сторонниками «твёрдых денег»: оно снижает инфляцию, но может создавать денежный дефицит в периоды нехватки золота."
  law_bimetallic_ratio_15_desc: "Золото юридически оценивается в пятнадцать раз дороже серебра. Это сбалансированное соотношение, близкое к международным нормам: такой подход поддерживает обращение обоих металлов и отражает классический биметаллический стандарт XIX века. Хотя он более стабилен, риск арбитража сохраняется, когда мировые рынки отклоняются от юридического соотношения."
  law_bimetallic_ratio_20_desc: "Золото юридически оценивается в двадцать раз дороже серебра. Соотношение в пользу серебра, расширяющее денежную массу, часто поддерживаемое аграрными или популистскими движениями. Это может стимулировать рост в период экономических трудностей, но несёт риск притока серебра, инфляции и исчезновения золотых резервов."
