# from localization/<lang>/ld_cm_goods_l_<lang>.yml (11 languages; english and russian here)
localization/english/ld_cm_goods_l_english.yml: zz_ef_stock_issue_literacy:0 "Narrow Investor Base"
localization/english/ld_cm_goods_l_english.yml: zz_ef_stock_issue_literacy_desc:0 "Only literate people wealthy enough to buy financial products can hold shares. They are under 12% of the population, so private buildings issue fewer stocks: issuance is proportional to the share of literate wealthy pops (wealth 15 and up), in full at 12% and above. Now: [GetPlayer.MakeScope.Var('zz_ef_literate_rich_share').GetValue|%1]."
localization/russian/ld_cm_goods_l_russian.yml: zz_ef_stock_issue_literacy:0 "Узкий круг вкладчиков"
localization/russian/ld_cm_goods_l_russian.yml: zz_ef_stock_issue_literacy_desc:0 "Покупать и понимать акции может только грамотный и достаточно богатый житель. Таких в стране меньше 12% населения, поэтому частные здания выпускают меньше акций: выпуск пропорционален доле грамотных богатых (от 15-го уровня богатства) и полный при 12% и выше. Сейчас: [GetPlayer.MakeScope.Var('zz_ef_literate_rich_share').GetValue|%1]."
