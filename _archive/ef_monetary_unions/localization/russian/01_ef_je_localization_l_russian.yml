latin_monetary_union_progress_bar: "Количество лет дебатов"
latin_monetary_union_progress_bar_desc: "Количество лет дебатов: [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)] Год(лет) / 6 лет — [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]"
latin_monetary_union_1_button: "Выйти из конвенции"
latin_monetary_union_1_button_desc: "Вы выходите из конвенции. Вы по-прежнему сможете наблюдать за ходом формирования валютного союза, но больше не будете считаться среди стран-подписантов, когда переговоры подойдут к завершению."
latin_monetary_union_2_button: "Снова вступить в конвенцию"
latin_monetary_union_2_button_desc: "Вы решаете снова вступить в конвенцию и быть засчитанным среди стран-подписантов по её завершении."
  scandinavian_monetary_union_je_1: "Конвенция Скандинавского монетного союза"
  scandinavian_monetary_union_je_1_reason: "Конвенция Скандинавского монетного союза направлена на создание регионального валютного альянса, построенного вокруг общего золотого стандарта.\n Это соглашение стремится ввести единые спецификации для чеканки монет и денежно-кредитной политики, позволяя валютам подписавших государств постепенно сближаться к единой системе.\n\n После завершения этой записи журнала конечной целью станет подписание долгосрочного валютного договора между #v державой-инициатором#! и #v участвующими государствами#!.\n\n В рамках этого договора страны-подписанты обязуются принять закон #v [GetLawType('law_gold_standard').GetName]#! и [concept_money_value_target_real], определённый инициатором конвенции.\n\n Государства-подписанты будут:\n – принимать коэффициент конвертации в золото ([concept_money_value_target_real]), установленный инициатором;\n – приводить свою денежную систему к стандарту инициатора (#v Закон [GetLawType('law_gold_standard').GetName]#!), независимо от прежнего режима.\n\n Со временем стоимость их валют будет сходиться к общему золотому ориентиру.\n\n Текущее количество стран, участвующих в конвенции: #p [GetPlayer.MakeScope.ScriptValue('scandinavian_monetary_union_country_in_debat')+]#!"
  scandinavian_monetary_union_je_1_desc.2: "конвенция длилась более 3 лет"
  scandinavian_monetary_union_je_1_desc.3: "[SCOPE.sC('target_country').GetName] подписывает #v Договор Скандинавского монетного союза.#!"
  scandinavian_monetary_union_je_1_desc.4: "Больше не существует действительного инициатора, способного довести конвенцию до завершения"
  scandinavian_monetary_union_je_1_desc.5: "Если переговоры провалятся, они завершатся, и вы потеряете статус инициатора."
