# from localization/russian/01_ef_event_localization_l_russian.yml
l_russian:
  00_ef_economic_event.8.t:0 "Предложение [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] о проведении Международной валютной конференции"
  00_ef_economic_event.8.d:1 "К гармонизации латинских валют"
  00_ef_economic_event.8.f:1 "[SCOPE.sC('target_country').GetAdjective]ое правительство сегодня приглашает несколько соседних государств принять участие в международной валютной конференции, призванной гармонизировать вес, пробу и стоимость золотых и серебряных монет.\n\nЦель этой инициативы — облегчить денежное обращение между государствами, стабилизировать обменные курсы и заложить основу для возможной общей системы среди латинских стран и, шире, по всей Европе.\n\nПравительствам, получившим приглашение, теперь предстоит решить, хотят ли они участвовать в этих переговорах."
  00_ef_economic_event.8.a:0 "Присоединиться к переговорам"
  00_ef_economic_event.8.b:0 "Принять к сведению"
  00_ef_economic_event.9.t:0 "Прогресс в переговорах о Латинском монетном союзе"
  00_ef_economic_event.9.d:0 "Переговоры продвигаются"
  00_ef_economic_event.9.f:0 "Государства, участвующие в обсуждениях будущего #b Латинского монетного союза#!, продолжают продвигаться вперёд. Несмотря на разногласия по поводу веса, пробы и соотношения золота и серебра в монетной системе, переговоры идут в атмосфере устойчивой дипломатии.\n\nКонвенция остаётся открытой: любая заинтересованная страна всё ещё может присоединиться к переговорам и повлиять на подготовку окончательного договора."
  00_ef_economic_event.9.a:0 "Присоединиться к переговорам"
  00_ef_economic_event.9.b:0 "Принять к сведению"
  00_ef_economic_event.10.t:0 "Четыре года переговоров о Латинском союзе"
  00_ef_economic_event.10.d:0 "Переговоры затягиваются"
  00_ef_economic_event.10.f:0 "Прошло уже четыре года с тех пор, как делегации впервые собрались, чтобы наметить основы будущего #b Латинского монетного союза#!. Конференции сменяют друг друга, отчёты множатся, а эксперты продолжают спорить о стандартах, которые следует принять.\n\nНесмотря на медленный темп, постепенно начинают вырисовываться компромиссы: позиции сближаются по вопросам паритета металлов, пробы монет и единых правил чеканки. Конвенция остаётся открытой, и любая страна всё ещё может присоединиться к продолжающимся переговорам."
  00_ef_economic_event.10.a:0 "Присоединиться к переговорам"
  00_ef_economic_event.10.b:0 "Принять к сведению"
  00_ef_economic_event.11.t:0 "[SCOPE.sC('target_country').GetName] вступает в валютные переговоры"
  00_ef_economic_event.11.d:1 "Участие [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] в обсуждениях Латинского союза"
  00_ef_economic_event.11.f:1 "[SCOPE.sC('target_country').GetAdjective]ое правительство объявляет о своём участии в дипломатических переговорах, направленных на гармонизацию стандартов серебряной и золотой монеты среди латинских стран.\n\nУже тесно ориентируясь на французскую денежную систему, [SCOPE.sC('target_country').GetName] видит в этих переговорах возможность укрепить торговые связи и усилить стабильность собственной валюты.\n\nПредставители [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] таким образом присоединяются к подготовительной работе над тем, что может перерасти в региональный валютный союз."
  00_ef_economic_event.11.a:0 "Приветствовать делегацию [SCOPE.sC('target_country').GetAltName('RU_CL_RP')]"
  00_ef_economic_event.12.t:0 "Подписание договора о Латинском монетном союзе"
  00_ef_economic_event.12.d:1 "[SCOPE.sC('target_country').GetName] подписывает двадцатилетнюю конвенцию" 
  00_ef_economic_event.12.f:1 "Правительство [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] официально подписало #v Договор о Латинском монетном союзе#!, взяв на себя двадцатилетнее обязательство принять общие денежные стандарты, определённые конвенцией.\n \n Ратифицируя соглашение, [SCOPE.sC('target_country').GetName] принимает установленный под французским руководством паритет между золотом и серебром, приводит стоимость своей валюты в соответствие с эталонным стандартом Союза и соглашается на постепенную гармонизацию своей монеты с монетой других государств-подписантов.\n \n Это обязательство знаменует собой важный шаг к более глубокой финансовой интеграции и свобод"
  00_ef_economic_event.12.a:0 "Подтвердить обязательство"
 00_ef_economic_event.19.t:0 "Предложение [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] о Скандинавском валютном союзе"
 00_ef_economic_event.19.d:0 "К северному финансовому сотрудничеству"
 00_ef_economic_event.19.f:0 "[SCOPE.sC('target_country').GetAdjective]ое правительство предлагает созвать конференцию, которая объединит скандинавские королевства, с целью изучить возможность создания валютного союза на основе золотого стандарта.\n\nЦель этой инициативы — облегчить торговлю, стабилизировать курсы шведской и датско-норвежской крон и сформировать общую финансовую основу среди северных государств.\n\nТеперь приглашённым государствам предстоит решить, хотят ли они участвовать в этих обсуждениях."
 00_ef_economic_event.19.a:0 "Присоединиться к переговорам"
 00_ef_economic_event.19.b:0 "Принять к сведению"
 00_ef_economic_event.20.t:0 "Прогресс в переговорах о Скандинавском валютном союзе"
 00_ef_economic_event.20.d:0 "Переговоры продвигаются"
 00_ef_economic_event.20.f:0 "Государства, участвующие в обсуждениях будущего #b Скандинавского валютного союза#!, продолжают продвигаться вперёд. Хотя сохраняются разногласия по поводу принятия общего золотого стандарта и унификации практик чеканки монет, переговоры развиваются в атмосфере устойчивой дипломатии.\n\nКонвенция остаётся открытой: любая заинтересованная страна в Скандинавии всё ещё может присоединиться к переговорам и повлиять на подготовку итогового соглашения."
 00_ef_economic_event.20.a:0 "Присоединиться к переговорам"
 00_ef_economic_event.20.b:0 "Принять к сведению"
 00_ef_economic_event.21.t:0 "Два года переговоров о Скандинавском союзе"
 00_ef_economic_event.21.d:0 "Переговоры затягиваются"
 00_ef_economic_event.21.f:0 "Прошло уже два года с тех пор, как делегации впервые собрались, чтобы наметить основы будущего #b Скандинавского валютного союза#!. Заседания следуют одно за другим, документы накапливаются, а специалисты продолжают спорить о технических условиях, необходимых для общей системы на основе золота.\n\nНесмотря на медленный темп, постепенно появляются компромиссы: позиции начинают сближаться по вопросу принятия общего золотого стандарта и унификации практик чеканки монет. Конвенция остаётся открытой, и любое заинтересованное государство в Скандинавии всё ещё может присоединиться к продолжающимся переговорам."
 00_ef_economic_event.21.a:0 "Присоединиться к переговорам"
 00_ef_economic_event.21.b:0 "Принять к сведению"
 00_ef_economic_event.22.t:0 "[SCOPE.sC('target_country').GetName] присоединяется к валютным переговорам"
 00_ef_economic_event.22.d:0 "Участие [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] в переговорах о Скандинавском союзе"
 00_ef_economic_event.22.f:0 "[SCOPE.sC('target_country').GetAdjective]ое правительство объявило о своём участии в дипломатических обсуждениях, направленных на создание общей денежной системы на основе золота среди скандинавских государств.\n\nВидя возможность укрепить региональную торговлю и стабилизировать собственную валюту, [SCOPE.sC('target_country').GetName] присоединил[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')]ся к продолжающимся переговорам.\n\nТеперь его представители участвуют в подготовительной работе, которая может привести к созданию единой скандинавской валютной системы."
 00_ef_economic_event.22.a:0 "Приветствовать делегацию [SCOPE.sC('target_country').GetAltName('RU_CL_RP')]"
 00_ef_economic_event.23.t:0 "Подписание договора о Скандинавском валютном союзе"
 00_ef_economic_event.23.d:0 "[SCOPE.sC('target_country').GetName] подписывает двадцатилетнюю конвенцию"
 00_ef_economic_event.23.f:0 "Правительство [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] официально подписало #v Договор о Скандинавском валютном союзе#!, взяв на себя двадцатилетнее обязательство принять общие денежные стандарты на основе золота, определённые конвенцией.\n\nРатифицируя соглашение, [SCOPE.sC('target_country').GetName] принимает общий золотой стандарт, установленный Союзом, согласовывает стоимость своей валюты с утверждённым эталонным ориентиром и обязуется постепенно унифицировать практики чеканки монет с другими государствами-подписантами.\n\nЭто обязательство знаменует важный шаг к более глубокой финансовой интеграции и свободному обращению стандартизированных золотых валют среди членов Союза."
 00_ef_economic_event.23.a:0 "Подтвердить обязательство"
 00_ef_economic_event.24.t:0 "Принятие золотого стандарта"
 00_ef_economic_event.24.d:0 "[SCOPE.sC('target_country').GetName] приводится в соответствие с денежным стандартом Союза"
 00_ef_economic_event.24.f:0 "После ратификации #v Договора о Скандинавском валютном союзе#!, [SCOPE.sC('target_country').GetName] теперь официально принимает золотой стандарт, определённый инициатором конвенции.\n\nПринимая эти рамки, страна соглашается применять эталонный золотой паритет, установленный государством-инициатором, и скорректировать собственную денежную систему, чтобы соответствовать этому ориентиру.\n\nЭто становится решающим шагом на пути к унификации скандинавских валют и созданию полностью единого денежного пространства на основе золота."
 00_ef_economic_event.24.a:0 "Внедрить новый стандарт"
