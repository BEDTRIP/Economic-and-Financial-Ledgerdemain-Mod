# from localization/english/01_ef_je_localization_l_english.yml
l_english:
  latin_monetary_union_je_1: "Latin Monetary Union Convention"
  latin_monetary_union_je_1_reason: "The Convention on the Latin Union aims at establishing a regional monetary alliance, founded by France, Belgium, Switzerland, and Italy.\n This agreement establishes common standards for gold and silver coins, allowing the currencies of member states to circulate freely throughout the Union.\n\n Once the journal entry is completed, the final objective is the signing of a twenty-year monetary treaty between #v France#!, the initiating power, and the #v participating countries#!.\n\n This treaty sets a common monetary framework in which the states commit to respecting the standards defined by France.\n\n The countries signing the treaty will see:\n - the gold/silver exchange ratio fixed according to the values in force in France\n - the monetary standard aligned with the French monetary standard (regardless of the current standard)\n\n thus, over the years, the value of the currencies of these different countries will tend toward a common value.\n\n Current number of countries in the convention: #p [GetPlayer.MakeScope.ScriptValue('latin_monetary_union_country_in_debat')+]#!"
  latin_monetary_union_je_1_desc.1: "France initiated the discussions on the Latin Union"
  latin_monetary_union_je_1_desc.2: "the convention lasted more than 6 years"
  latin_monetary_union_je_1_desc.3: "[SCOPE.sC('target_country').GetName] signs the #v Latin Monetary Union Treaty.#!"
  status_latin_monetary_union_je_1: "The convention is currently joined by:"
  status_latin_monetary_union_je_2: "#v $FRA$#!"
  status_latin_monetary_union_je_3: "- #v $BEL$#!"
  status_latin_monetary_union_je_4: "- #v $SWI$#!"
  status_latin_monetary_union_je_5: "- #v $SAR$#!"
  status_latin_monetary_union_je_6: "- #v $PAR$#!"
  status_latin_monetary_union_je_7: "- #v $MOD$#!"
  status_latin_monetary_union_je_8: "- #v $LUC$#!"
  status_latin_monetary_union_je_9: "- #v $TUS$#!"
  status_latin_monetary_union_je_10: "- #v $PAP$#!"
  status_latin_monetary_union_je_11: "- #v $SIC$#!"
  status_latin_monetary_union_je_12: "- #v $GRE$#!"
  status_latin_monetary_union_je_13: "- #v $ITA$#!"
  status_latin_monetary_union_je_14: "- #v [ROOT.GetCountry.GetNameNoFormatting]#!"
latin_monetary_union_progress_bar: "Number of years of debate"
latin_monetary_union_progress_bar_desc: "Number of years of debate: [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)] Year(s) / 6 Years — [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]"
latin_monetary_union_1_button: "Withdraw from the convention"
latin_monetary_union_1_button_desc: "You withdraw from the convention. You will still be able to observe the progress of the monetary union, but you will no longer be counted among the signatory nations once the negotiations reach their conclusion."
latin_monetary_union_2_button: "Re-enter the convention"
latin_monetary_union_2_button_desc: "You decide to re-enter the convention and be counted among the signatory nations at its completion."
  scandinavian_monetary_union_je_1: "Scandinavian Monetary Union Convention"
  scandinavian_monetary_union_je_1_reason: "The Convention on the Scandinavian Monetary Union aims to establish a regional monetary alliance built around a shared gold-based standard.\n This agreement seeks to introduce common specifications for coinage and monetary policy, allowing the currencies of the signatory states to gradually converge toward a unified system.\n\n Once this journal entry is completed, the final objective is the signing of a long-term monetary treaty between #v the initiating power#! and the #v participating states#!.\n\n Under this treaty, the signatory countries commit to adopting the #v [GetLawType('law_gold_standard').GetName] Law#! and the [concept_money_value_target_real] defined by the initiator of the convention.\n\n Signatory states will:\n – adopt the gold conversion ratio ([concept_money_value_target_real]) established by the initiator;\n – align their monetary system with the initiator's standard (#v [GetLawType('law_gold_standard').GetName] Law#!), regardless of their previous regime.\n\n Over time, the value of their currencies will converge toward a common gold-based benchmark.\n\n Current number of countries participating in the convention: #p [GetPlayer.MakeScope.ScriptValue('scandinavian_monetary_union_country_in_debat')+]#!"
  scandinavian_monetary_union_je_1_desc.2: "the convention lasted more than 3 years"
  scandinavian_monetary_union_je_1_desc.3: "[SCOPE.sC('target_country').GetName] signs the #v Scandinavian Monetary Union Treaty.#!"
  scandinavian_monetary_union_je_1_desc.4: "Il n'existe plus d'initiateur valid pour mener la convention au bout"
  scandinavian_monetary_union_je_1_desc.5: "If the talks fail, the negotiations end and you lose your initiator status."
  status_scandinavian_monetary_union_je_1: "The convention is currently joined by:"
  status_scandinavian_monetary_union_je_2: "#v $SWE$#!"
  status_scandinavian_monetary_union_je_3: "#v $DEN$#!"
  status_scandinavian_monetary_union_je_4: "#v $NOR$#!"
  status_scandinavian_monetary_union_je_5: "- #v $SWE$#!"
  status_scandinavian_monetary_union_je_6: "- #v $DEN$#!"
  status_scandinavian_monetary_union_je_7: "- #v $NOR$#!"
  status_scandinavian_monetary_union_je_8: "- #v [ROOT.GetCountry.GetNameNoFormatting]#!"
  scandinavian_monetary_union_progress_bar: "Number of years of debate"
  scandinavian_monetary_union_progress_bar_desc: "Number of years of debate: [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)] Year(s)/3 Years - [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]"
  scandinavian_monetary_union_1_button: "Ce retirer de la convention"
  scandinavian_monetary_union_1_button_desc: "You withdraw from the convention, vous pourrai toujours voir l'avancement de l'union monetaire mais vous ne ferai pas partis des pays signatère once the convention reaches its conclusion."
  scandinavian_monetary_union_2_button: "Re-enter the convention"
  scandinavian_monetary_union_2_button_desc: "You decide to re-enterr dans la convention and be counted among the signatory nations à la fin de celle-ci."
