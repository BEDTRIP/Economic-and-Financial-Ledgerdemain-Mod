l_english:
  treaty_name_union_latine: "Latin Monetary Union Treaty"
  latin_monetary_union_treaty: "Latin Monetary Union Treaty"
  latin_monetary_union_treaty_desc: ""
  latin_monetary_union_treaty_effects_desc: "• Establishes a monetary union that aligns our country's monetary standards with those in force in France"
  latin_monetary_union_treaty_article_short_desc: "– Gold–silver parity follows the French legal ratio (#T 1 @gold! = [GetPlayer.MakeScope.ScriptValue('rate_by_law_metal_type_FRA')|D] @silver!/1 @silver! = [GetPlayer.MakeScope.ScriptValue('rate_by_law_metal_type_2_FRA')|D] @gold!#!).\n – The monetary standard is aligned with the French standard."
  treaty_name_scandinavian_monetary_union: "Scandinavian Monetary Union Treaty"
  scandinavian_monetary_union_treaty: "Scandinavian Monetary Union Treaty"
  scandinavian_monetary_union_treaty_desc: ""
  scandinavian_monetary_union_treaty_effects_desc: "• Establishes a monetary union that aligns our country's monetary standards with those defined by the initiator of the convention."
