  notification_00_ef_economic_event_97_message_name:0 "Арбитраж на [SCOPE.sC('seller').GetCustom('currency_name')]"
  notification_00_ef_economic_event_97_message_desc:0 "Рост курса повысил привлекательность валюты, и частные банки стали докупать её, чтобы воспользоваться новым паритетом. Это подстёгивает приток металла в страну-эмитент.\n\nВ рамках этого банк приобрёл в общей сложности #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_currency').GetValue|D] [SCOPE.sC('seller').GetCustom('currency_symbol')]#! — что соответствует #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('seller').GetCustom('monetary_system_partiel')] — сообразно рыночным условиям и действующему паритету.\n\nОперация отражает инвестиционную стратегию банка и возросшее доверие к валюте."

  notification_00_ef_economic_event_971_message_tooltip:0 "#header $notification_00_ef_economic_event_971_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_971_message_desc$"
  notification_00_ef_economic_event_971_message_name:0 "Накопление [SCOPE.sC('seller').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
  notification_00_ef_economic_event_971_message_desc:0 "Благодаря устойчивости и центральной роли в международных расчётах эта валюта исторически занимает привилегированное место в структуре банковских резервов. Финансовые учреждения естественным образом стремятся держать её значительную долю — и чтобы обезопасить активы, и чтобы облегчить внешние операции.\n\nВ рамках этого банк приобрёл в общей сложности #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_currency').GetValue|D] [SCOPE.sC('seller').GetCustom('currency_symbol')]#! — что соответствует #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('seller').GetCustom('monetary_system_partiel')] — сообразно принятой финансовой практике.\n\nЭто движение показывает денежный престиж страны-эмитента и структурообразующую роль её валюты в равновесии мировой системы."

  notification_00_ef_economic_event_98_message_tooltip:0 "#header $notification_00_ef_economic_event_98_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_98_message_desc$"
  notification_00_ef_economic_event_98_message_name:0 "Продажа [SCOPE.sC('buyer').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
  notification_00_ef_economic_event_98_message_desc:0 "Он продал в общей сложности #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_10_in_currency').GetValue|D] [SCOPE.sC('buyer').GetCustom('currency_symbol')]#! — что соответствует #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('buyer').GetCustom('monetary_system_partiel')] — сообразно рыночным условиям.\n\nОперация отражает арбитражную стратегию банка после смягчения денежной политики, которое снижает относительную привлекательность валюты на рынках."

  notification_00_ef_economic_event_981_message_tooltip:0 "#header $notification_00_ef_economic_event_981_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_981_message_desc$"
  notification_00_ef_economic_event_981_message_name:0 "Продажа [SCOPE.sC('buyer').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
  notification_00_ef_economic_event_981_message_desc:0 "Официальная ревальвация стандарта повысила законную стоимость валюты. Частные банки играют на этом, продавая валюту ради металла, ставшего относительно более выгодным.\n\nВ рамках этого банк продал в общей сложности #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_10_in_currency').GetValue|D] [SCOPE.sC('buyer').GetCustom('currency_symbol')]#! — что соответствует #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('buyer').GetCustom('monetary_system_partiel')] — сообразно рыночным условиям.\n\nЭто примерно #v 10%#! резервов банка, задействованных ради выгоды от разрыва, созданного новым официальным паритетом."

  notification_00_ef_economic_event_982_message_tooltip:0 "#header $notification_00_ef_economic_event_982_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_982_message_desc$"
  notification_00_ef_economic_event_982_message_name:0 "Давление на [SCOPE.sC('buyer').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
  notification_00_ef_economic_event_982_message_desc:0 "Завися от #v серебра#! @silver!, стоимость валюты напрямую зависит от международных колебаний цены металла. Когда серебро дешевеет, частные банки склонны избавляться от этой валюты, считая её более уязвимой, чем валюты на более устойчивых стандартах.\n\nВ этих условиях банк продал в общей сложности #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_10_in_currency').GetValue|D] [SCOPE.sC('buyer').GetCustom('currency_symbol')]#! — что соответствует #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('buyer').GetCustom('monetary_system_partiel')] — сообразно рыночным условиям.\n\nДавление финансовых учреждений показывает уязвимость валюты, привязанной к металлу с сильной международной волатильностью."

