# из localization/english/01_ef_event_localization_l_english.yml, строки 276–357 (на 6.10.2026), ключи локализации событий .97–.105 и сообщений .97–.982
 #00_ef_economic_event.97
00_ef_economic_event.97.t:0 "Arbitrage on the [SCOPE.sC('seller').GetCustom('currency_name')]"
00_ef_economic_event.97.d:0 "The bank #v [SCOPE.sCompany('buyer').GetName]#! of #v [SCOPE.sC('buyer_country').GetName]#! has carried out an arbitrage operation on the currency of [SCOPE.sC('seller').GetName], following an increase in the base rate."
00_ef_economic_event.97.f:0 "The rise in the rate has strengthened the attractiveness of the currency, prompting private banks to acquire additional currency in order to benefit from the new parity. This dynamic encourages increased inflows of metal into the issuing country.\n\nWithin this framework, the bank acquired a total of #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_currency').GetValue|D] [SCOPE.sC('seller').GetCustom('currency_symbol')]#! — equivalent to #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('seller').GetCustom('monetary_system_partiel')] — in accordance with market conditions and the prevailing parity.\n\nThis operation reflects the bank’s investment strategy as well as renewed confidence in the currency."
00_ef_economic_event.97.a:0 "Continue"

#00_ef_economic_event.971
00_ef_economic_event.971.t:0 "Accumulation of [SCOPE.sC('seller').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
00_ef_economic_event.971.d:0 "The bank #v [SCOPE.sCompany('buyer').GetName]#! of #v [SCOPE.sC('buyer_country').GetName]#! has strengthened its holdings of the currency of [SCOPE.sC('seller').GetName], considered the reference currency of the international monetary system."
00_ef_economic_event.971.f:0 "Due to its stability and its central role in international settlements, this currency has historically occupied a privileged position in the composition of bank reserves. Financial institutions naturally seek to hold a significant share of it, both to secure their assets and to facilitate their external operations.\n\nWithin this framework, the bank acquired a total of #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_currency').GetValue|D] [SCOPE.sC('seller').GetCustom('currency_symbol')]#! — equivalent to #v [SCOPE.sC('buyer_country').MakeScope.Var('arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('seller').GetCustom('monetary_system_partiel')] — in accordance with prevailing financial practices.\n\nThis movement illustrates the monetary prestige of the issuing country and the structuring role its currency plays in the balance of the global system."
00_ef_economic_event.971.a:0 "Continue"


#00_ef_economic_event.98
00_ef_economic_event.98.t:0 "Sale of [SCOPE.sC('buyer').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
00_ef_economic_event.98.d:0 "The bank #v [SCOPE.sCompany('seller').GetName]#! of #v [SCOPE.sC('seller_country').GetName]#! has carried out a sale of currency on international markets, following a reduction in the base rate."
00_ef_economic_event.98.f:0 "It sold a total of #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_10_in_currency').GetValue|D] [SCOPE.sC('buyer').GetCustom('currency_symbol')]#! — equivalent to #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('buyer').GetCustom('monetary_system_partiel')] — in accordance with market conditions.\n\nThis operation reflects the bank’s arbitrage strategy following monetary easing, which reduces the relative attractiveness of the currency on the markets."
00_ef_economic_event.98.a:0 "Continue"

#00_ef_economic_event.981
00_ef_economic_event.981.t:0 "Sale of [SCOPE.sC('buyer').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
00_ef_economic_event.981.d:0 "The bank #v [SCOPE.sCompany('seller').GetName]#! of #v [SCOPE.sC('seller_country').GetName]#! has carried out a sale of currency on international markets, following an increase in the statutory value of the monetary standard."
00_ef_economic_event.981.f:0 "The official revaluation of the standard has increased the legal value of the currency. Private banks arbitrage this situation by selling the currency in order to recover metal, which has become relatively more advantageous.\n\nWithin this framework, the bank sold a total of #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_10_in_currency').GetValue|D] [SCOPE.sC('buyer').GetCustom('currency_symbol')]#! — equivalent to #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('buyer').GetCustom('monetary_system_partiel')] — in accordance with market conditions.\n\nThis operation represents approximately #v 10%#! of the reserves held by the bank, mobilized to take advantage of the gap created by the new official parity."
00_ef_economic_event.981.a:0 "Continue"

#00_ef_economic_event.982
00_ef_economic_event.982.t:0 "Pressure on the [SCOPE.sC('buyer').GetCustom('currency_name')] [SCOPE.sC('seller').GetCustom('currency_symbol')]"
00_ef_economic_event.982.d:0 "The bank #v [SCOPE.sCompany('seller').GetName]#! of #v [SCOPE.sC('seller_country').GetName]#! has carried out a significant sale of currency on international markets, as the currency is exposed to fluctuations in the global price of silver."
00_ef_economic_event.982.f:0 "Dependent on #v Silver#! @silver!, the value of the currency is directly affected by international variations in the metal. When the price of silver weakens, private banks tend to divest themselves of this currency, considered more fragile compared to currencies backed by more stable standards.\n\nIn this context, the bank sold a total of #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_10_in_currency').GetValue|D] [SCOPE.sC('buyer').GetCustom('currency_symbol')]#! — equivalent to #v [SCOPE.sC('buyer').MakeScope.Var('sell_arbitrage_value_in_metal').GetValue|D]#! [SCOPE.sC('buyer').GetCustom('monetary_system_partiel')] — in accordance with market conditions.\n\nThe pressure exerted by financial institutions illustrates the vulnerability of a currency tied to a metal subject to strong international volatility."
00_ef_economic_event.982.a:0 "Continue"

