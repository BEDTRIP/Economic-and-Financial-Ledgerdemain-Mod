  TOOLTIP_FOREIGN_COLLATERAL: "#header Иностранное золотое обеспечение:#!\n- Общий долг центрального банка: #v [Country.MakeScope.ScriptValue('total_debt')|D]#! [Country.GetCustom('monetary_system')]\n > Долг центрального банка, возникший из-за государственных заимствований: #v [Country.MakeScope.ScriptValue('bond_market_index')|D]#! [Country.GetCustom('monetary_system')]\n > Дефицит центрального банка, необходимый для поддержания валюты: #v [Country.MakeScope.ScriptValue('central_bank_debt')|D]#! [Country.GetCustom('monetary_system')]\n  -> [Localize('central_bank_metal_reserves_state_to_ensure_the_conversion')]: #v [Country.MakeScope.ScriptValue('central_bank_metal_reserves_state_to_ensure_the_conversion')|D]#! [Country.GetCustom('monetary_system')]\n  -> [Localize('central_bank_equity')]: #v [Country.MakeScope.ScriptValue('central_bank_equity')|D]#! [Country.GetCustom('monetary_system')]\n  -> Оставшаяся сумма, которую нужно покрыть: #v [Country.MakeScope.ScriptValue('total_debt_in_gold')|D]#! [Country.GetCustom('monetary_system')]\n \n- Общая доступная ёмкость финансирования: #v [Country.MakeScope.ScriptValue('total_debt_in_gold')|D]#! [Country.GetCustom('monetary_system')]\n > Всего металлов выдано в кредит (без учёта процентов): #v [Country.MakeScope.ScriptValue('gold_loaned_to_central_bank')|D]#! [Country.GetCustom('monetary_system')]\n > Оставшийся долг, который можно профинансировать: #v [Country.MakeScope.ScriptValue('remaining_debt')|D]#! [Country.GetCustom('monetary_system')]"
  TOOLTIP_FOREIGN_COLLATERAL_player: "#header Иностранное золотое обеспечение:#!\n- Общий долг центрального банка: #v [GetPlayer.MakeScope.ScriptValue('total_debt')|D]#! [GetPlayer.GetCustom('monetary_system')]\n > Долг центрального банка, возникший из-за государственных заимствований: #v [GetPlayer.MakeScope.ScriptValue('bond_market_index')|D]#! [GetPlayer.GetCustom('monetary_system')]\n > Дефицит центрального банка, необходимый для поддержания валюты: #v [GetPlayer.MakeScope.ScriptValue('central_bank_debt')|D]#! [GetPlayer.GetCustom('monetary_system')]\n  -> [Localize('central_bank_metal_reserves_state_to_ensure_the_conversion')]: #v [GetPlayer.MakeScope.ScriptValue('central_bank_metal_reserves_state_to_ensure_the_conversion')|D]#! [GetPlayer.GetCustom('monetary_system')]\n  -> [Localize('central_bank_equity')]: #v [GetPlayer.MakeScope.ScriptValue('central_bank_equity')|D]#! [GetPlayer.GetCustom('monetary_system')]\n  -> Итого: #v [GetPlayer.MakeScope.ScriptValue('central_bank_metal_reserves_state_to_ensure_the_conversion')|D] [GetPlayer.GetCustom('monetary_system')] - [GetPlayer.MakeScope.ScriptValue('central_bank_equity')|D] [GetPlayer.GetCustom('monetary_system')] = [GetPlayer.MakeScope.ScriptValue('central_bank_debt')|D]#! [GetPlayer.GetCustom('monetary_system')]\n  -> Текущие технологии позволяют #p [GetPlayer.MakeScope.ScriptValue('central_bank_debt_by_tech_ratio')|D]%#! финансирования частными банками\n  -> Оставшаяся разрешённая сумма: #v [GetPlayer.MakeScope.ScriptValue('central_bank_debt')|D]#! [GetPlayer.GetCustom('monetary_system')] x #p [GetPlayer.MakeScope.ScriptValue('central_bank_debt_by_tech_ratio_decimal')|D]#! = #v [GetPlayer.MakeScope.ScriptValue('central_bank_debt_by_tech')|D]#! [GetPlayer.GetCustom('monetary_system')]\n  -> Оставшаяся разрешённая сумма в золоте: #v [GetPlayer.MakeScope.ScriptValue('central_bank_debt_by_tech')|D]#![GetPlayer.GetCustom('monetary_system')] + #v [GetPlayer.MakeScope.ScriptValue('bond_market_index')|D]#![GetPlayer.GetCustom('monetary_system')] = #v [GetPlayer.MakeScope.ScriptValue('total_debt_in_gold')|D]#! @gold!\n \n- Общая доступная ёмкость финансирования: #v [GetPlayer.MakeScope.ScriptValue('total_debt_in_gold')|D]#! @gold!\n > Всего металлов выдано в кредит (без процентов): #v [GetPlayer.MakeScope.ScriptValue('gold_loaned_to_central_bank')|D]#! @gold! (в паритете национального металла #v [GetPlayer.MakeScope.ScriptValue('gold_loaned_to_central_bank_in_national_metal')|D]#! [GetPlayer.GetCustom('monetary_system')])\n > Оставшийся долг, который можно профинансировать: #v [GetPlayer.MakeScope.ScriptValue('remaining_debt')|D]#! @gold!"
