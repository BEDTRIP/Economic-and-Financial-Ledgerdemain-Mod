l_korean:
 zz_ef_xwin_title:0 "Exchange"
 zz_ef_xwin_update:0 "Update"
 zz_ef_xwin_update_tt:0 "Fill the exchange's table as of today: the claims of the chosen kind we hold and a short list of countries whose claims are worth buying."
 zz_ef_xwin_kind_button:0 "Money / bonds"
 zz_ef_xwin_kind_effect:0 "Show the other kind of claims — money or bonds"
 zz_ef_xwin_less:0 "−"
 zz_ef_xwin_more:0 "+"
 zz_ef_xwin_less_effect:0 "The order's sum halved"
 zz_ef_xwin_more_effect:0 "The order's sum doubled"
 zz_ef_xwin_sum:0 "Order sum: #b [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')]#!"
 zz_ef_xwin_head_m:0 "#b Other countries' money#! #grey (the central bank buys and sells)#!\n#grey By row: the fair price — gold a unit of money; last week — the deal's price on our exchange, 0 — no deal; ours — what our CB holds. The exchange's fund buys at [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_bid_v')|%1] of the fair price and sells at [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_ask_v')|%1]; the exchange's fee [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_fee_v')|%2] — paid by the buyer. «Buy» — an order for the sum at up to the fair price + 2 %, «Sell» — all we hold at down to the fair price − 2 %; the order goes into the book of the nearest week.#!"
 zz_ef_xwin_head_b:0 "#b Other countries' bonds#! #grey (the treasury buys and sells)#!\n#grey By row: the fair price — gold a unit of debt (the coupon against the yield); last week — the deal's price on our exchange, 0 — no deal; ours — what the treasury holds. The exchange's fee [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_fee_v')|%2] — paid by the buyer; the fund holds no bonds. «Buy» — an order for the sum at up to the fair price + 2 %, «Sell» — all we hold at down to the fair price − 2 %; the order goes into the book of the nearest week.#!"
 zz_ef_xwin_empty:0 "#grey Press «Update».#!"
 zz_ef_xwin_row:0 "fair [Scope.GetCountry.MakeScope.Var('zz_ef_xwin_fair').GetValue|3], last week [Scope.GetCountry.MakeScope.Var('zz_ef_xwin_last').GetValue|3], ours [Scope.GetCountry.MakeScope.Var('zz_ef_xwin_hold').GetValue|D]"
 zz_ef_xwin_buy:0 "Buy"
 zz_ef_xwin_sell:0 "Sell"
 zz_ef_xwin_buy_effect:0 "An order to buy for [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')] — into the book of the nearest week"
 zz_ef_xwin_sell_effect:0 "An order to sell all we hold — into the book of the nearest week"
 zz_ef_xwin_tt_no_exchange:0 "No exchange on our route: none of our own, of the market owner, the bloc leader or the world"
 zz_ef_xwin_tt_who:0 "Money is bought by the central bank, bonds by the treasury; the debtor must have bonds"
 zz_ef_xwin_tt_nothing:0 "Nothing to sell"
