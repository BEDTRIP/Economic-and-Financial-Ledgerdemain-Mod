l_japanese:
 lawgroup_ld_central_bank:0 "Central bank"
 lawgroup_ld_central_bank_desc:0 "Who runs the central bank: the state, private shareholders or nobody."
 law_ld_cb_state:0 "State central bank"
 law_ld_cb_state_desc:0 "The central bank belongs to the state: it holds the reserves, issues the banknotes and lends to the treasury and the banks."
 law_ld_cb_private:0 "Private central bank"
 law_ld_cb_private_desc:0 "The central bank is a private company with a state charter."
 law_ld_cb_foreign:0 "Foreign central bank"
 law_ld_cb_foreign_desc:0 "The central bank is a foreign bank present in the country: its profit goes to the bank, its bonds are issued by its branch. If the bank leaves the country or its home country goes to war with us, the central bank passes to the state."
 law_ld_cb_none:0 "No central bank"
 law_ld_cb_none_desc:0 "There is no central bank: the banks issue the notes and keep their own reserves."
