l_japanese:
 zz_ef_trm_title:0 "Treasury hoard"
 zz_ef_trm_title_tt:0 "The treasury's metal — the state's own stock, apart from the monetary authority's reserves: it covers nothing. Bought and sold on the market through the country's Banks; sold to the monetary authority at parity less a [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_fee')|%1] commission; bought back from it at parity plus the commission (from a CB on a metal standard — only the metal above the cover norm). Without a CB on a fiat, exchange or external standard the treasury itself is the monetary authority."
 zz_ef_trm_gold_row:0 "Gold: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_gold_goods_v')|1]#! (orders: buy [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_buy_g_v')|1], sell [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_sell_g_v')|1])"
 zz_ef_trm_silver_row:0 "Silver: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_silver_goods_v')|1]#! (orders: buy [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_buy_s_v')|1], sell [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_sell_s_v')|1])"
 zz_ef_trm_value_row:0 "At parity: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_money_v')|K]#!"
 zz_ef_trm_btn_buy:0 "Buy"
 zz_ef_trm_btn_sell:0 "Sell"
 zz_ef_trm_btn_to_auth:0 "Hand in"
 zz_ef_trm_btn_from_auth:0 "Buy back"
 zz_ef_trm_buy_effect:0 "Order the Banks to buy [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] more units on the market; an opposite sell order is cancelled."
 zz_ef_trm_sell_effect:0 "Order the Banks to sell [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] more units on the market; an opposite buy order is cancelled."
 zz_ef_trm_to_auth_effect:0 "Hand [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] units to the monetary authority at parity less the commission; the money goes to the treasury."
 zz_ef_trm_from_auth_effect:0 "Buy [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] units back from the monetary authority at parity plus the commission, out of the treasury."
