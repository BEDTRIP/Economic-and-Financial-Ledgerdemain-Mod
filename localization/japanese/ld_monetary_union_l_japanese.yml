l_japanese:
 ld_monetary_integration:0 "Monetary Integration"
 ld_monetary_integration_desc:0 ""
 ld_monetary_integration_effects_desc:0 "• [SOURCE_COUNTRY.GetNameNoFormatting] joins the currency union of [TARGET_COUNTRY.GetNameNoFormatting]: it issues the union's currency at the union's parity, takes the standard and the monetary policy of the union's head, its key rate; the cover is the union's, payments between members need no clearing. If neither is in a union, the treaty founds one."
 ld_monetary_integration_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] joins the currency union of [TARGET_COUNTRY.GetNameNoFormatting]"
 zz_ef_mu_follower_tt:0 "Not a member of a currency union that follows its head"
 zz_ef_mu_tt_tech:0 "Has researched Central Banking"
 zz_ef_mu_tt_source_free:0 "The joining country is not in a currency union"
 zz_ef_mu_tt_target_head:0 "The other country heads its currency union or is in none"
 zz_ef_mu_tt_cb:0 "The union's head has a central bank"
 zz_ef_mu_tt_bloc_kept:0 "A member of a power bloc's currency union stays in the bloc"
 zz_ef_mu_acc_relations:0 "Relations"
 zz_ef_mu_acc_strength:0 "Strength of the currencies"
 zz_ef_mu_acc_metal:0 "The same metal of the standard"
 zz_ef_mu_acc_market:0 "The same market"
 zz_ef_mu_acc_great_power:0 "A great power keeps its money"
 zz_ef_mu_acc_bloc:0 "Market unification in the power bloc"
 zz_ef_mu_acc_historic:0 "A historic currency union"
 ld_monetary_union_je:0 "Currency Union of the Bloc"
 ld_monetary_union_je_reason:0 "A currency union is a treaty of countries on one money: every member issues the union's currency at one parity, the cover is counted for the whole union, the head sets the key rate, and payments between members go as inside one country. Countries join it by the article «Monetary Integration» with the union's head; the 3rd level of the principle «Market Unification» makes the members of our bloc agree more readily."
 ld_monetary_union_je_status:0 "Members of the bloc in our currency union: [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_bloc_in_v')|0] of [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_bloc_all_v')|0]; the union's cover [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]."
 ld_monetary_union_je_goal:0 "Half of the bloc's members ([GetPlayer.MakeScope.ScriptValue('zz_ef_mu_bloc_half_v')|0]) are in our currency union"
 ld_latin_union_je:0 "Latin Monetary Union"
 ld_latin_union_je_reason:0 "In 1865 France, Belgium, Switzerland and Italy, later Greece, agreed on one money: the franc at the legal ratio of 15.5 to 1. Treaties of «Monetary Integration» with these countries make the union."
 ld_latin_union_je_status:0 "Countries of the Latin union in ours: [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_latin_in_v')|0] of [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_latin_all_v')|0] (Belgium, Switzerland, the Italian states or Italy, Greece)."
 ld_latin_union_je_goal:0 "Half of the countries of the list ([GetPlayer.MakeScope.ScriptValue('zz_ef_mu_latin_half_v')|0]) are in our currency union"
 ld_scandinavian_union_je:0 "Scandinavian Monetary Union"
 ld_scandinavian_union_je_reason:0 "In 1873 Sweden and Denmark, then Norway, agreed on one money — the gold krone. Treaties of «Monetary Integration» with these countries make the union."
 ld_scandinavian_union_je_status:0 "Countries of the Scandinavian union in ours: [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_scand_in_v')|0] of [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_scand_all_v')|0] (Denmark, Norway)."
 ld_scandinavian_union_je_goal:0 "Half of the countries of the list ([GetPlayer.MakeScope.ScriptValue('zz_ef_mu_scand_half_v')|0]) are in our currency union"
 ld_mu_historic_lost:0 "A country of the list is in another currency union"
 ld_mu_union_prestige:0 "Currency union of the bloc"
 ld_mu_historic_prestige:0 "Historic currency union"
