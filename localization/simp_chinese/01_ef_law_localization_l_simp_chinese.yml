  # Desc :
  law_no_monetary_policy_desc: "No trajectory for the national currency."
  law_revaluation_desc: "Increase in the value of the national currency compared to the gold."
  law_devaluation_desc: "Decrease in the value of the national currency compared to the gold."
  law_large_monetary_policy_desc: "The central bank is granted broad authority to intervene in monetary affairs, allowing for large-scale expansion or contraction of the money supply. Such powers enable the government to respond aggressively to economic crises, stimulate growth, finance extraordinary expenditures, or stabilize the national currency when necessary. IGs are more inclined to enact this law if the Central bank metal reserve ratio falls below 75% or rises above 125%."

  law_war_economy_desc: "Laws that transform the national economy into a war economy."
   
