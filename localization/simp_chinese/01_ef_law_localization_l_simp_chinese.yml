  law_silver_exchange_standard: "Silver Exchange Standard"
  law_bimetallism_exchange_standard: "Bimetallic Exchange Standard"
  law_silver_exchange_standard_desc: "An exchange standard on silver: the reserves are held in silver and in a reference foreign currency; the parity is in silver. The metal can be changed by moving to another exchange standard."
  law_bimetallism_exchange_standard_desc: "An exchange standard on both metals: the reserves are held in gold and silver at the legal ratio and in a reference foreign currency; the parity is in gold. The metal can be changed by moving to another exchange standard."
  law_floating_exchange_rates: "Floating Exchange Rates" 

  law_no_monetary_system_icon: "Fiat Standard"
  law_fiat_standard_icon: "@fiat_standard!"
  law_silver_standard_icon: "@silver_standard!"
