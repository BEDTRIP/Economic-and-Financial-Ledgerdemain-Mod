  law_no_monetary_system: "No Monetary System"
  law_fiat_standard: "Fiat Standard"
  law_silver_standard: "Silver Standard"
  law_bimetallism_standard: "Bimetallism Standard"
  law_gold_standard: "Gold Standard"
