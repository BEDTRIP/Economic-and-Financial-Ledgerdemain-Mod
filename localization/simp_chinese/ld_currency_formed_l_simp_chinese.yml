l_simp_chinese:
 ld_currency_formed.1.t:0 "A Currency for [ROOT.GetCountry.GetName]"
 ld_currency_formed.1.d:0 "With the new state proclaimed, the question of its money cannot wait. The old notes and coins still circulate, and the treasury and the central bank must decide whether [ROOT.GetCountry.GetName] keeps the #v [ROOT.GetCountry.GetCustom('currency_name')]#! or introduces the #v [ROOT.GetCountry.GetCustom('zz_ef_cf_target_name')]#!."
 ld_currency_formed.1.f:0 "A reform converts the old currency at parity: the metal behind every note stays the same, only the unit changes. Foreign central banks holding the old currency receive the new one."
 ld_currency_formed.1.a:0 "Introduce the [ROOT.GetCountry.GetCustom('zz_ef_cf_target_name')]"
 ld_currency_formed.1.b:0 "Keep the [ROOT.GetCountry.GetCustom('currency_name')]"
