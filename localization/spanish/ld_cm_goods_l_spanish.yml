 # R8б.6: the investment fund (Д.R8б.6, Д.П.3 -- the texts of the concept «Инвестиционный фонд»)
 building_ld_investment_fund:0 "Investment Fund"
 building_ld_investment_fund_desc:0 "An investment fund pools the money of its shareholders and invests it in claims — foreign money, bonds, stocks. The shareholders — the population and the banks — buy its shares and share its profits and losses. Capitalists and companies that own its building next to the stock exchange run the fund; the building's levels set how many claims the fund can hold. The population pays for the shares out of its deposits, the banks out of their own funds; the fund's money lies as a deposit in the banks of the exchange's country and earns the deposit rate, and when the fund is founded the banks put a tenth of their capital into it. Each level of the building lets it hold 100,000 of claims. On the exchange the fund works as a dealer: for every asset it has two prices, a bid and an ask, no further than 2 % from the fair price; the spread is half the key rate in its country. It takes the unmatched rest of the book and the holders' small positions, and works off the gap between a bimetallic standard's legal ratio and the world's price of the metals."
