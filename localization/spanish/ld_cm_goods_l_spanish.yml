 # R8б.6: the investment fund (Д.R8б.6, Д.П.3 -- the texts of the concept «Инвестиционный фонд»)
 building_ld_investment_fund:0 "Investment Fund"
 building_ld_investment_fund_desc:0 "An investment fund pools the money of its shareholders and invests it in claims — foreign money, bonds, stocks. The shareholders — the population and the banks — buy its shares and share its profits and losses. Capitalists and companies that own its building next to the stock exchange run the fund; the building's levels set how many claims the fund can hold. On the exchange the fund works as a dealer: for every asset it has two prices, a bid and an ask; the higher the key rate in its country, the wider the spread."
 pmg_zz_ef_bank_funds:0 "Fund Shares"
 pm_zz_ef_bank_no_funds:0 "No Fund Shares"
 pm_zz_ef_bank_funds:0 "Fund Shares"
 pm_zz_ef_bank_funds_desc:0 "The banks put part of their money into the shares of their exchange's investment fund. On when the market sells the fund's shares."
