  silver_standard_01_monetary_systeme_money_value_tooltip:0 "#header Current value of the currency in silver @silver!: 1 [GetPlayer.GetCustom('currency_symbol')] = [GetPlayer.MakeScope.ScriptValue('money_value_silver_standard')|D] @silver!#!\n- Gold equivalent based on the Global metal price: #v [GetPlayer.MakeScope.ScriptValue('money_value_silver_standard')|D] @silver! x [GetPlayer.MakeScope.ScriptValue('silver_to_gold_rate')|D] = [GetPlayer.MakeScope.ScriptValue('money_value_silver_standard_in_gold')|D] @gold! #!"
  bimetallism_standard_01_monetary_systeme_money_value_tooltip:0 "#header Current value of the currency in bimetallism @bimetallism!: 1 [GetPlayer.GetCustom('currency_symbol')] = [GetPlayer.MakeScope.ScriptValue('money_value_bimetallism_standard')|D] @bimetallism!#!\n- Money value proportional to silver reserves: #v [GetPlayer.MakeScope.ScriptValue('money_value_silver_standard_in_gold')|D]@gold! x [GetPlayer.MakeScope.ScriptValue('weight_silver')|%|] = [GetPlayer.MakeScope.ScriptValue('bimetallism_standard_proportional_silver')|D]#!@gold!\n- Money value proportional to gold reserves: #v [GetPlayer.MakeScope.ScriptValue('money_value_gold_standard')|D]@gold! x [GetPlayer.MakeScope.ScriptValue('weight_gold')|%|] = [GetPlayer.MakeScope.ScriptValue('bimetallism_standard_proportional_gold')|D]#!@gold!"
  gold_standard_01_monetary_systeme_money_value_tooltip:0  "#header Current value of the currency in gold@gold!: 1 [GetPlayer.GetCustom('currency_symbol')] = [GetPlayer.MakeScope.ScriptValue('money_value_gold_standard')|D] @gold!"
