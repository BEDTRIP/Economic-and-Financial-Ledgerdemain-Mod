  #economic panel
  _debt_in_national:0 "You have a deficit of #v [Localize(Concatenate(Scope.GetFlagName,'_debt_in_national'))]#!, which increases by [Localize(Concatenate(Scope.GetFlagName,'_import_in'))] per month."
  _debt_in_national_currency:0 "Your deficit of #v [Localize(Concatenate(Scope.GetFlagName,'_debt_in_national'))]#!, once converted into its equivalent under the [GetPlayer.GetCustom('monetary_system_name')] system ([GetPlayer.MakeScope.ScriptValue('money_value')|D][GetPlayer.GetCustom('monetary_system')]), amounts to [Localize(Concatenate(Scope.GetFlagName,'_debt_in_national_currency'))]. This amount increases each month by [Localize(Concatenate(Scope.GetFlagName,'_import_in_gold'))]."

  _stockpiling_currency_state:0 "You hold [Localize(Concatenate(Scope.GetFlagName,'_stockpiling_currency_state'))] in your trade balance. This reserve increases by [Localize(Concatenate(Scope.GetFlagName,'_export_in'))] per month."
  _currency_state_in_gold:0 "The amount of [Localize(Concatenate(Scope.GetFlagName,'_stockpiling_currency_state'))] is converted into its metallic equivalent. The value of [Localize(Concatenate(Scope.GetFlagName,'_stockpiling_currency_state'))] is multiplied by [Localize(Concatenate(Scope.GetFlagName,'_tooltips_4'))], which corresponds to the gold value of the currency [Localize(Concatenate(Scope.GetFlagName,'_tooltips_4_1'))]. If you possess [GetLawType('law_silver_standard').GetName], this gold value is further multiplied by the gold–silver conversion ratio #v (1 @gold! = [GetPlayer.MakeScope.ScriptValue('gold_to_silver_rate')|D] @silver!)#!.\n\nIf you are under the [GetLawType('law_gold_standard').GetName] or [GetLawType('law_bimetallism_standard').GetName], the gold value of the original currency is used directly without any silver conversion. The final amount obtained is [Localize(Concatenate(Scope.GetFlagName,'_currency_state_in_gold'))]. Likewise, the monthly amount of [Localize(Concatenate(Scope.GetFlagName,'_export_in'))] corresponds to [Localize(Concatenate(Scope.GetFlagName,'_export_in_gold'))] once converted into gold.\n\nIf you are under the [GetLawType('law_silver_standard').GetName] after the Silver Crisis of 1873, a progressive penalty is applied to the gold-to-silver conversion of the currencies you accumulate. As silver becomes increasingly unstable, fewer central banks are able or willing to provide the silver equivalent of your exports, reducing your competitiveness in the calculation of your trade balance.\n\nThe applied penalty is x[GetPlayer.MakeScope.ScriptValue('silver_crisis_multiplicator_factor')|D+].\n\nThe final result is [Localize(Concatenate(Scope.GetFlagName,'_tooltips_4_2'))]."

  per_week:0 "[Localize(Concatenate(Scope.GetFlagName,'_name_accumulation_player_country'))] per Week"
