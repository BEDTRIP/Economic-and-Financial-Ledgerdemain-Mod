  bimetallism_standard_01_monetary_systeme_metal_reserve_in_gold_tooltip:0 "#header Total reserve in accordance with current law: [GetPlayer.MakeScope.ScriptValue('central_bank_reserves_bimetallism_standard')|D] @bimetallism! #!\n- Silver Reserve: #b [GetPlayer.MakeScope.ScriptValue('silver_state_native_for_stockpile')|D]#! @silver! (Silver reserve in gold by Global price: #b [GetPlayer.MakeScope.ScriptValue('silver_state_native_for_stockpile_in_gold')|D|]#! @gold!)\n- Gold Reserve: #b [GetPlayer.MakeScope.ScriptValue('gold_state_native_for_stockpile')|D]#! @gold!"
