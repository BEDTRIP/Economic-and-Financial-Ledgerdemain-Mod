l_braz_por:
 zz_ef_xwin_title:0 "Exchange"
 zz_ef_xwin_update:0 "Update"
 zz_ef_xwin_update_tt:0 "The tables refresh by themselves each week, after the book's clearing; the button fills them now: what of the chosen kind we hold and what trades on our exchange."
 zz_ef_xwin_kind_button:0 "Money / bonds"
 zz_ef_xwin_kind_effect:0 "Show the other kind of claims — money or bonds"
 zz_ef_xwin_less:0 "−"
 zz_ef_xwin_more:0 "+"
 zz_ef_xwin_less_effect:0 "The order's sum halved"
 zz_ef_xwin_more_effect:0 "The order's sum doubled"
 zz_ef_xwin_sum:0 "Order sum: #b [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')]#!"
 zz_ef_xwin_head_m:0 "#b Other countries' money#! #grey — the central bank buys and sells. The exchange's fee [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_fee_v')|%2] is paid by the buyer.#!"
 zz_ef_xwin_head_b:0 "#b Other countries' bonds#! #grey — the treasury buys and sells. The exchange's fee [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_fee_v')|%2] is paid by the buyer; the exchange's fund holds no bonds.#!"
 zz_ef_xwin_own_title:0 "#b Our assets#!"
 zz_ef_xwin_own_title_tt:0 "The claims of the chosen kind we hold. «Sell» — an order for all we hold at no less than the fair price − 2 %; it goes into the book of the nearest week."
 zz_ef_xwin_book_title:0 "#b Offers on the [GetPlayer.MakeScope.Var('zz_ef_xch').GetCountry.GetName] exchange#!"
 zz_ef_xwin_book_title_tt:0 "The assets that went through our exchange's book last week and the countries whose claims are worth holding: our market's owner, our bloc's leader, the reference, the largest markets; bonds — our own too: «Buy» at our country buys back our debt, what is bought is cleared. «Buy» — an order for the order sum at no more than the fair price + 2 %; it goes into the book of the nearest week. Our exchange — our own, else the market owner's, the bloc leader's or the world one."
 zz_ef_xwin_empty:0 "#grey Empty — press «Update».#!"
 zz_ef_xwin_col_country:0 "Country"
 zz_ef_xwin_col_country_tt:0 "Whose money or bonds these are — the debtor country"
 zz_ef_xwin_col_hold:0 "Held"
 zz_ef_xwin_col_hold_tt:0 "How much of this asset we hold — in the debtor's currency (bonds — the principal in its currency). That much can be offered for sale."
 zz_ef_xwin_col_fair:0 "Price"
 zz_ef_xwin_col_fair_tt:0 "The fair price: money — our currency a unit of the debtor's (the parities' ratio × the debtor's rate to its parity × the exchange's multiplier); bonds — % of the principal (what is still paid on them). The multiplier rises when the asset is bought up and falls when nobody takes it — up to 1 % a week. The book's steps stand around the price, 0.5 % each."
 zz_ef_xwin_col_gold:0 "Worth"
 zz_ef_xwin_col_gold_tt:0 "What our asset is worth in our currency at the fair price"
 zz_ef_xwin_col_last:0 "Last"
 zz_ef_xwin_col_last_tt:0 "Last week — the price the asset sold at on our exchange last week (as the «Price» column); 0 — no deals"
 zz_ef_xwin_col_bid:0 "Bid"
 zz_ef_xwin_col_bid_tt:0 "Fund bid — the price the exchange's fund buys the rest that found no buyer at (as the «Price» column)"
 zz_ef_xwin_col_ask:0 "Ask"
 zz_ef_xwin_col_ask_tt:0 "Fund ask — the price the exchange's fund sells from its stock at when sellers fall short (as the «Price» column)"
 zz_ef_xwin_buy:0 "Buy"
 zz_ef_xwin_sell:0 "Sell"
 zz_ef_xwin_buy_effect:0 "An order to buy for [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')] — into the book of the nearest week; it stays until filled or cancelled"
 zz_ef_xwin_sell_effect:0 "An order to sell all we hold — into the book of the nearest week; it stays while there is something to sell or until cancelled"
 zz_ef_xwin_tt_no_exchange:0 "No exchange on our route: none of our own, of the market owner, the bloc leader or the world"
 zz_ef_xwin_tt_who:0 "Money is bought by the central bank, bonds by the treasury; the debtor must have bonds"
 zz_ef_xwin_tt_nothing:0 "Nothing to sell"
 zz_ef_xwin_ord_title:0 "#b Our orders#!"
 zz_ef_xwin_ord_title_tt:0 "The orders we placed that are not filled yet: each week they go into our exchange's book again until filled or until you cancel them. A buy — for the sum left at no more than the fair price + 2 %, a sell — all we hold at no less than the fair price − 2 %."
 zz_ef_xwin_col_side:0 "Order"
 zz_ef_xwin_col_side_tt:0 "Buy or sell"
 zz_ef_xwin_col_left:0 "Left"
 zz_ef_xwin_col_left_tt:0 "A buy — how much more to spend, in our currency; a sell — all we hold"
 zz_ef_xwin_side_buy:0 "buy"
 zz_ef_xwin_side_sell:0 "sell"
 zz_ef_xwin_ord_left:0 "[Scope.GetCountry.MakeScope.Var('zz_ef_xwin_ob').GetValue|D] [GetPlayer.GetCustom('currency_symbol')]"
 zz_ef_xwin_ord_all:0 "all we hold"
 zz_ef_xwin_cancel:0 "Cancel"
 zz_ef_xwin_cancel_effect:0 "Take our order off the exchange"
