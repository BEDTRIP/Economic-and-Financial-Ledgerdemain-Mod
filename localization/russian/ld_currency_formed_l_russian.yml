l_russian:
 ld_currency_formed.1.t:0 "[ROOT.GetCountry.GetName]: новая валюта"
 ld_currency_formed.1.d:0 "Новое государство провозглашено, и вопрос о его деньгах не ждёт. Прежние банкноты и монеты ещё в ходу, и казне с центральным банком предстоит решить, какой валютой пользоваться: прежней — #v [ROOT.GetCountry.GetCustom('currency_name')]#! — или новой — #v [ROOT.GetCountry.GetCustom('zz_ef_cf_target_name')]#!."
 ld_currency_formed.1.f:0 "Реформа обменивает старую валюту по паритету: металл за каждой банкнотой остаётся тем же, меняется только единица. Иностранные центральные банки, державшие старую валюту, получают новую."
 ld_currency_formed.1.a:0 "Ввести новую валюту: [ROOT.GetCountry.GetCustom('zz_ef_cf_target_name')]"
 ld_currency_formed.1.b:0 "Сохранить прежнюю: [ROOT.GetCountry.GetCustom('currency_name')]"
