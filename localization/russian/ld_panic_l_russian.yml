 notification_zz_ef_panic_start_desc:0 "Доверие к деньгам рухнуло: [GetPlayer.MakeScope.ScriptValue('zz_ef_trust_v')|%0]. Население забирает вклады из банков наличными — втрое быстрее обычного, пока доверие не вернётся."
 notification_zz_ef_panic_start_tooltip:0 "#header $notification_zz_ef_panic_start_name$#!\n$TOOLTIP_DELIMITER$\n$notification_zz_ef_panic_start_desc$"
 notification_zz_ef_panic_end_name:0 "Банковская паника позади"
 notification_zz_ef_panic_end_desc:0 "Доверие к деньгам восстановилось: [GetPlayer.MakeScope.ScriptValue('zz_ef_trust_v')|%0]. Вклады и наличные снова движутся в обычном темпе."
 notification_zz_ef_panic_end_tooltip:0 "#header $notification_zz_ef_panic_end_name$#!\n$TOOLTIP_DELIMITER$\n$notification_zz_ef_panic_end_desc$"
