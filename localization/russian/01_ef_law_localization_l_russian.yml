private_liquidity_provision: "Частное обеспечение ликвидности"
private_liquidity_provision_desc: "Частные банки активно предоставляют краткосрочную ликвидность финансовой системе, сглаживая рыночную напряжённость и поддерживая кредитные потоки без прямого вмешательства центрального банка."

advanced_interbank_refinancing: "Развитое межбанковское рефинансирование"
advanced_interbank_refinancing_desc: "Развитая система межбанковского рефинансирования позволяет банкам получать доступ к ликвидности через структурированные межбанковские рынки, повышая финансовую стабильность, оборот капитала и устойчивость к кризисам."
