  law_external_exchange_standard: "Внешний валютный стандарт"
  law_external_exchange_standard_desc: "Эта денежная система привязывает страну к внешней власти или союзу, требуя принятия валюты, чей паритет и конвертируемость определяются за её пределами. Государство не может свободно корректировать денежно-кредитную политику и должно следовать правилам обмена, требованиям к резервам и правовым стандартам, установленным сюзеренным государством или валютным союзом."





