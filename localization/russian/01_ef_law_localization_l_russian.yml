  # Desc :
  law_no_monetary_policy_desc: "Нет заданной траектории для национальной валюты."
  law_revaluation_desc: "Повышение стоимости национальной валюты по отношению к золоту."
  law_devaluation_desc: "Снижение стоимости национальной валюты по отношению к золоту."
  law_large_monetary_policy_desc: "Центральному банку предоставляются широкие полномочия для вмешательства в денежную сферу, позволяющие проводить масштабное расширение или сокращение денежной массы. Такие полномочия дают правительству возможность решительно реагировать на экономические кризисы, стимулировать рост, финансировать чрезвычайные расходы или стабилизировать национальную валюту, когда это необходимо. Заинтересованные группы охотнее поддерживают принятие этого закона, если доля металлических резервов центрального банка опускается ниже 75% или поднимается выше 125%."

  law_war_economy_desc: "Законы, переводящие национальную экономику на военные рельсы."
   
