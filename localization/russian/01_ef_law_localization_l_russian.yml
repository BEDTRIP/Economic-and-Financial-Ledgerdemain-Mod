  law_silver_exchange_standard_desc: "Обменный стандарт на серебре: резервы — в серебре и в эталонной иностранной валюте, паритет — в серебре. Металл меняется переходом на другой обменный стандарт."
  law_bimetallism_exchange_standard_desc: "Обменный стандарт на двух металлах: резервы — в золоте и серебре по законному соотношению и в эталонной иностранной валюте, паритет — в золоте. Металл меняется переходом на другой обменный стандарт."
  law_floating_exchange_rates: "Плавающий валютный курс" 

