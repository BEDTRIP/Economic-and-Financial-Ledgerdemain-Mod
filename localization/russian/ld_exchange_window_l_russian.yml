l_russian:
 zz_ef_xwin_title:0 "Биржа"
 zz_ef_xwin_update:0 "Обновить"
 zz_ef_xwin_update_tt:0 "Таблицы обновляются сами раз в неделю, после сведения стакана; кнопка — заполнить их сейчас: что из выбранного вида у нас есть и что торгуется на нашей бирже."
 zz_ef_xwin_kind_button:0 "Деньги / облигации"
 zz_ef_xwin_kind_effect:0 "Показать другой вид требований — деньги или облигации"
 zz_ef_xwin_less:0 "−"
 zz_ef_xwin_more:0 "+"
 zz_ef_xwin_less_effect:0 "Сумма заявки — вдвое меньше"
 zz_ef_xwin_more_effect:0 "Сумма заявки — вдвое больше"
 zz_ef_xwin_sum:0 "Сумма заявки: #b [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')]#!"
 zz_ef_xwin_head_m:0 "#b Деньги других стран#! #grey — покупает и продаёт центральный банк. Комиссия биржи [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_fee_v')|%2] — с покупателя.#!"
 zz_ef_xwin_head_b:0 "#b Облигации других стран#! #grey — покупает и продаёт казна. Комиссия биржи [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_fee_v')|%2] — с покупателя; фонд биржи облигаций не держит.#!"
 zz_ef_xwin_own_title:0 "#b Наши активы#!"
 zz_ef_xwin_own_title_tt:0 "Требования выбранного вида, которые у нас есть. «Продать» — заявка на всё, что есть, по цене не ниже справедливой − 2 %; уходит в стакан ближайшей недели."
 zz_ef_xwin_book_title:0 "#b Предложения на бирже [GetPlayer.MakeScope.Var('zz_ef_xch').GetCountry.GetName]#!"
 zz_ef_xwin_book_title_tt:0 "Активы, которые прошли через стакан нашей биржи на прошлой неделе, и страны, чьи требования стоит держать: хозяин нашего рынка, лидер блока, эталон, самые крупные рынки; облигации — и наши собственные: «Купить» у своей страны выкупает наш долг, купленное гасится. «Купить» — заявка на сумму заявки по цене не выше справедливой + 2 %; уходит в стакан ближайшей недели. Наша биржа — своя, иначе биржа хозяина рынка, лидера блока или мировая."
 zz_ef_xwin_empty:0 "#grey Пусто — нажмите «Обновить».#!"
 zz_ef_xwin_col_country:0 "Страна"
 zz_ef_xwin_col_country_tt:0 "Чьи это деньги или облигации — страна-должник"
 zz_ef_xwin_col_hold:0 "Держим"
 zz_ef_xwin_col_hold_tt:0 "Сколько у нас этого актива — в валюте страны-должника (облигации — номинал в её валюте). Столько можно выставить на продажу."
 zz_ef_xwin_col_fair:0 "Цена"
 zz_ef_xwin_col_fair_tt:0 "Справедливая цена: деньги — сколько нашей валюты за единицу валюты должника (курс по паритетам × курс к паритету должника × множитель биржи); облигации — % номинала (что по ним ещё выплатят). Множитель растёт, когда актив раскупают, и падает, когда не берут, — до 1 % в неделю. Вокруг цены стоят шаги стакана, по 0,5 %."
 zz_ef_xwin_col_gold:0 "Стоимость"
 zz_ef_xwin_col_gold_tt:0 "Сколько наш актив стоит в нашей валюте по справедливой цене"
 zz_ef_xwin_col_last:0 "Прошл."
 zz_ef_xwin_col_last_tt:0 "Прошлая неделя — цена, по которой актив продали на нашей бирже на прошлой неделе (как столбец «Цена»); 0 — сделок не было"
 zz_ef_xwin_col_bid:0 "Берёт"
 zz_ef_xwin_col_bid_tt:0 "Фонд берёт — по какой цене фонд биржи купит остаток, который не нашёл покупателя (как столбец «Цена»)"
 zz_ef_xwin_col_ask:0 "Отдаёт"
 zz_ef_xwin_col_ask_tt:0 "Фонд отдаёт — по какой цене фонд биржи продаст из запаса, если продавцов не хватило (как столбец «Цена»)"
 zz_ef_xwin_buy:0 "Купить"
 zz_ef_xwin_sell:0 "Продать"
 zz_ef_xwin_buy_effect:0 "Заявка на покупку на [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')] — в стакан ближайшей недели; стоит, пока не исполнится или вы её не отмените"
 zz_ef_xwin_sell_effect:0 "Заявка на продажу всего, что есть, — в стакан ближайшей недели; стоит, пока есть что продавать или вы её не отмените"
 zz_ef_xwin_tt_no_exchange:0 "Нет биржи по маршруту: нет своей, у хозяина рынка, лидера блока и в мире"
 zz_ef_xwin_tt_who:0 "Деньги покупает центральный банк, облигации — казна; у страны-должника должны быть облигации"
 zz_ef_xwin_tt_nothing:0 "Нечего продавать"
 zz_ef_xwin_ord_title:0 "#b Наши заявки#!"
 zz_ef_xwin_ord_title_tt:0 "Заявки, которые мы выставили и которые ещё не исполнены: каждую неделю они снова встают в стакан нашей биржи, пока не исполнятся или пока вы их не отмените. Покупка — на оставшуюся сумму по цене не выше справедливой + 2 %, продажа — всё, что держим, по цене не ниже справедливой − 2 %."
 zz_ef_xwin_col_side:0 "Заявка"
 zz_ef_xwin_col_side_tt:0 "Покупка или продажа"
 zz_ef_xwin_col_left:0 "Осталось"
 zz_ef_xwin_col_left_tt:0 "Покупка — сколько ещё потратить, в нашей валюте; продажа — всё, что держим"
 zz_ef_xwin_side_buy:0 "покупка"
 zz_ef_xwin_side_sell:0 "продажа"
 zz_ef_xwin_ord_left:0 "[Scope.GetCountry.MakeScope.Var('zz_ef_xwin_ob').GetValue|D] [GetPlayer.GetCustom('currency_symbol')]"
 zz_ef_xwin_ord_all:0 "всё, что держим"
 zz_ef_xwin_cancel:0 "Отменить"
 zz_ef_xwin_cancel_effect:0 "Снять нашу заявку с биржи"
