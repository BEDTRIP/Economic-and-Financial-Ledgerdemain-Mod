l_russian:
 zz_ef_xwin_title:0 "Биржа"
 zz_ef_xwin_update:0 "Обновить"
 zz_ef_xwin_update_tt:0 "Заполнить таблицу биржи на сегодня: требования выбранного вида, которые у нас есть, и короткий список стран, чьи требования стоит покупать."
 zz_ef_xwin_kind_button:0 "Деньги / облигации"
 zz_ef_xwin_kind_effect:0 "Показать другой вид требований — деньги или облигации"
 zz_ef_xwin_less:0 "−"
 zz_ef_xwin_more:0 "+"
 zz_ef_xwin_less_effect:0 "Сумма заявки — вдвое меньше"
 zz_ef_xwin_more_effect:0 "Сумма заявки — вдвое больше"
 zz_ef_xwin_sum:0 "Сумма заявки: #b [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')]#!"
 zz_ef_xwin_head_m:0 "#b Деньги других стран#! #grey (покупает и продаёт центральный банк)#!\n#grey По строкам: справедливая цена — золото за единицу денег; прошлая неделя — цена сделки на нашей бирже, 0 — сделки не было; наше — сколько держит наш ЦБ. Фонд биржи покупает по [GetPlayer.MakeScope.Var('zz_ef_xwin_bid').GetValue|%1] справедливой, продаёт по [GetPlayer.MakeScope.Var('zz_ef_xwin_ask').GetValue|%1]; комиссия биржи [GetPlayer.MakeScope.Var('zz_ef_xwin_fee').GetValue|%2] — с покупателя. «Купить» — заявка на сумму по цене до справедливой + 2 %, «Продать» — всё, что есть, по цене от справедливой − 2 %; заявка уходит в стакан ближайшей недели.#!"
 zz_ef_xwin_head_b:0 "#b Облигации других стран#! #grey (покупает и продаёт казна)#!\n#grey По строкам: справедливая цена — золото за единицу долга (купон к доходности); прошлая неделя — цена сделки на нашей бирже, 0 — сделки не было; наше — сколько держит казна. Комиссия биржи [GetPlayer.MakeScope.Var('zz_ef_xwin_fee').GetValue|%2] — с покупателя; фонд облигаций не держит. «Купить» — заявка на сумму по цене до справедливой + 2 %, «Продать» — всё, что есть, по цене от справедливой − 2 %; заявка уходит в стакан ближайшей недели.#!"
 zz_ef_xwin_empty:0 "#grey Нажмите «Обновить».#!"
 zz_ef_xwin_row:0 "справедливая [Scope.GetCountry.MakeScope.Var('zz_ef_xwin_fair').GetValue|3], прошлая неделя [Scope.GetCountry.MakeScope.Var('zz_ef_xwin_last').GetValue|3], наше [Scope.GetCountry.MakeScope.Var('zz_ef_xwin_hold').GetValue|D]"
 zz_ef_xwin_buy:0 "Купить"
 zz_ef_xwin_sell:0 "Продать"
 zz_ef_xwin_buy_effect:0 "Заявка на покупку на [GetPlayer.MakeScope.ScriptValue('zz_ef_xwin_sum_v')|D] [GetPlayer.GetCustom('currency_symbol')] — в стакан ближайшей недели"
 zz_ef_xwin_sell_effect:0 "Заявка на продажу всего, что есть, — в стакан ближайшей недели"
 zz_ef_xwin_tt_no_exchange:0 "Нет биржи по маршруту: нет своей, у хозяина рынка, лидера блока и в мире"
 zz_ef_xwin_tt_who:0 "Деньги покупает центральный банк, облигации — казна; у страны-должника должны быть облигации"
 zz_ef_xwin_tt_nothing:0 "Нечего продавать"
