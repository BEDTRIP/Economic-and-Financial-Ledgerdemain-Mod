# (calculate_construction_sector_max_level, Д.R9б.8) -- the levels of a state's sector that save construction goods.
l_russian:
 state_building_construction_sector_max_level_add:1 "Уровни: $building_construction_sector$ с экономией товаров"
 state_building_construction_sector_max_level_add_desc:1 "Сколько занятых уровней здания «$building_construction_sector$» в области экономят строительные товары. Уровни сверх этого строят, но без экономии."
