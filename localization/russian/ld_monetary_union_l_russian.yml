 ld_latin_union_je:0 "Латинский монетарный союз"
 ld_latin_union_je_reason:0 "В 1865 году Франция, Бельгия, Швейцария и Италия, позже Греция, договорились об общих деньгах — франке при законном соотношении 15,5 к 1. Союз складывается из договоров «Монетарная интеграция» с этими странами."
 ld_latin_union_je_status:0 "Стран Латинского союза в нашем: [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_latin_in_v')|0] из [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_latin_all_v')|0] (Бельгия, Швейцария, итальянские государства или Италия, Греция)."
