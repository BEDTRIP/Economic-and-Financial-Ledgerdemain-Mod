 ld_monetary_union_je_reason:0 "Валютный союз — договор стран об общих деньгах: каждый член выпускает валюту союза по одному паритету, покрытие считается по союзу целиком, ключевую ставку задаёт глава, а платежи между членами идут как внутри одной страны. Вступают статьёй «Монетарная интеграция» с главой союза; 3-й уровень принципа «Объединение рынков» делает членов нашего блока сговорчивее."
 ld_monetary_union_je_status:0 "Членов блока в нашем валютном союзе: [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_bloc_in_v')|0] из [GetPlayer.MakeScope.ScriptValue('zz_ef_mu_bloc_all_v')|0]; покрытие союза [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]."
