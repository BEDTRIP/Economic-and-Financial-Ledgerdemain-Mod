 ld_monetary_integration_effects_desc:0 "• [SOURCE_COUNTRY.GetNameNoFormatting] вступает в валютный союз [TARGET_COUNTRY.GetNameNoFormatting]: выпускает валюту союза по паритету союза, принимает стандарт и денежную политику главы союза, его ключевую ставку; покрытие — общее, платежи между членами идут без клиринга. Если ни одна из стран не в союзе, договор основывает его."
