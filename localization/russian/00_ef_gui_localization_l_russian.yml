  budget_panel_desc_raw_material:0 "Здесь вы можете купить сырьё на международном рынке. В отличие от договора о поставке сырья, здесь вы платите золотом по курсу глобальной эталонной валюты ([GetPlayer.GetCustom('global_monetary_reference_currency_ISO_4217')] [GetPlayer.GetCustom('global_monetary_reference_texture')]).\n У вас нет ограничения по количеству покупок, но вы не можете продавать товары.\n Военное снаряжение нельзя купить на международном рынке. Его можно приобрести только по договору о поставке воен. снаряжения."

