l_russian:
 lawgroup_ld_central_bank:0 "Центральный банк"
 lawgroup_ld_central_bank_desc:0 "Кто управляет центральным банком: государство, частные акционеры или никто."
 law_ld_cb_state:0 "Государственный центральный банк"
 law_ld_cb_state_desc:0 "Центральный банк принадлежит государству: держит резервы, выпускает банкноты, кредитует казну и банки."
 law_ld_cb_private:0 "Частный центральный банк"
 law_ld_cb_private_desc:0 "Центральный банк — частная компания с государственной хартией."
 law_ld_cb_foreign:0 "Иностранный центральный банк"
 law_ld_cb_foreign_desc:0 "Центральный банк — иностранный банк, работающий в стране: прибыль — банку, облигации выпускает его отделение. Банк ушёл из страны или его страна воюет с нами — центральный банк переходит государству."
 law_ld_cb_none:0 "Без центрального банка"
 law_ld_cb_none_desc:0 "Центрального банка нет: банкноты выпускают банки, резервы каждый держит сам."
