l_russian:
 zz_ef_trm_title:0 "Кубышка казны"
 zz_ef_trm_title_tt:0 "Металл казны — свой запас государства, отдельно от резервов денежной власти: ничего не покрывает. Купить и продать — на рынке через «Банки» страны; сдать денежной власти — по паритету за вычетом комиссии [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_fee')|%1]; выкупить у неё — по паритету с комиссией (у ЦБ на металлическом стандарте — только металл сверх нормы покрытия). Без ЦБ на фиатном, обменном или внешневалютном стандарте денежная власть — сама казна."
 zz_ef_trm_gold_row:0 "Золото: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_gold_goods_v')|1]#! (заявка: купить [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_buy_g_v')|1], продать [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_sell_g_v')|1])"
 zz_ef_trm_silver_row:0 "Серебро: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_silver_goods_v')|1]#! (заявка: купить [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_buy_s_v')|1], продать [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_sell_s_v')|1])"
 zz_ef_trm_value_row:0 "По паритету: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_money_v')|K]#!"
 zz_ef_trm_btn_buy:0 "Купить"
 zz_ef_trm_btn_sell:0 "Продать"
 zz_ef_trm_btn_to_auth:0 "Сдать"
 zz_ef_trm_btn_from_auth:0 "Выкупить"
 zz_ef_trm_buy_effect:0 "Заявка «Банкам» купить на рынке ещё [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] ед.; встречная заявка на продажу снимается."
 zz_ef_trm_sell_effect:0 "Заявка «Банкам» продать на рынке ещё [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] ед.; встречная заявка на покупку снимается."
 zz_ef_trm_to_auth_effect:0 "Сдать денежной власти [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] ед. по паритету за вычетом комиссии; деньги — в казну."
 zz_ef_trm_from_auth_effect:0 "Выкупить у денежной власти [GetPlayer.MakeScope.ScriptValue('zz_ef_trm_step_goods')|0] ед. по паритету с комиссией из казны."
