 zz_ef_ep_cbfx_title:0 "Резервы ЦБ по валютам"
 zz_ef_ep_cbfx_tt:0 "Чужие деньги в резервах ЦБ — вклады в банках стран-эмитентов (мировой клиринг): количество, в наших деньгах, в золоте и изменение за неделю. В подсказке денежной массы они в счёте «Заграница», в покрытии — деньги эмитентов, разменивающих их на металл."
 zz_ef_cbfx_week:0 "за неделю"
