 00_ef_economic_event.25.t:0 "Создание центрального банка"
 00_ef_economic_event.25.d:0 "[SCOPE.sC('target_country').GetName] создаёт национальный орган денежно-кредитного регулирования"
 00_ef_economic_event.25.f:0 "После принятия необходимого финансового законодательства [SCOPE.sC('target_country').GetName] официально провозглашает создание #b Центрального банка#!, которому поручено надзирать за национальной валютой и денежной стабильностью.\n\nВ рамках этой институциональной реформы правительство учреждает #b правовую основу#!, определяющую обязанности Банка: выпуск банкнот, регулирование денежной массы, надзор за коммерческими учреждениями и обеспечение конвертируемости национальной валюты.\n\nЭто становится решающей вехой в модернизации финансовой системы страны и укрепляет её способность интегрироваться в более широкие денежные соглашения."
 00_ef_economic_event.25.a:0 "Начинается новая денежная эпоха"

 00_ef_economic_event.26.t:0 "Принятие биметаллического стандарта"
 00_ef_economic_event.26.d:0 "[SCOPE.sC('target_country').GetName] вводит двойную конвертируемость"
 00_ef_economic_event.26.f:0 "Стремясь укрепить денежную стабильность, [SCOPE.sC('target_country').GetName] принял[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] ряд финансовых мер, устанавливающих #b биметаллический стандарт#! и предоставляющих полную конвертируемость национальной валюты как в #b золото#!, так и в #b серебро#!.\n\nЭто решение последовало за опасениями по поводу колебаний мировых цен на металлы и необходимостью обеспечить внутренние рынки более гибкой и устойчивой денежной основой. Привязывая валюту к двум эталонным металлам, правительство надеется расширить денежную массу, сохраняя долгосрочное доверие.\n\nИсторически принятая рядом государств, стремившихся к равновесию между коммерческим расширением и ценовой стабильностью, эта система призвана ограничить волатильность, одновременно обеспечивая более широкий доступ к чеканке монеты. [SCOPE.sC('target_country').GetName] теперь присоединяется к числу стран, опирающихся на двойную конвертируемость, чтобы защитить свою экономику от внешних потрясений."
 00_ef_economic_event.26.a:0 "Сбалансированный стандарт для неспокойных времён"
  00_ef_economic_event_desc.26.a:0 "На рынок выпускается объём, эквивалентный #n +3%#! годового производства #v серебра#! @silver!."
 00_ef_economic_event.27.t:0 "Принятие золотого стандарта"
 00_ef_economic_event.27.d:0 "[SCOPE.sC('target_country').GetName] устанавливает денежную систему, основанную на золоте"
 00_ef_economic_event.27.f:0 "Стремясь укрепить денежную стабильность и эффективнее интегрироваться в международные финансовые рынки, [SCOPE.sC('target_country').GetName] принял[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] новое финансовое законодательство, устанавливающее #b золотой стандарт#!.\n\nЭта реформа заменяет прежние порядки, привязывая национальную валюту исключительно к #b золоту#!, тем самым обеспечивая фиксированную конвертируемость и приводя страну в соответствие со всё более доминирующей мировой денежной тенденцией конца XIX века.\n\nИсторически государства принимали золотой стандарт, чтобы укрепить доверие инвесторов, стабилизировать обменные курсы и облегчить дальнюю торговлю. Приняв эту систему, [SCOPE.sC('target_country').GetName] стремится обеспечить долгосрочную денежную дисциплину и оградить свою экономику от волатильности, связанной с серебряными или смешанными стандартами.\n\nЭто решающий шаг к более предсказуемому, международно интегрированному финансовому порядку."
 00_ef_economic_event.27.a:0 "Прочная основа для будущего"
  00_ef_economic_event_desc.27.a:0 "На рынок выпускается объём, эквивалентный #n +3%#! годового производства #v серебра#! @silver!."

 00_ef_economic_event.28.t:0 "[SCOPE.sC('target_country').GetName] теряет денежную самостоятельность"
 00_ef_economic_event.28.d:0 "Подчинение сюзеренному органу"
 00_ef_economic_event.28.f:0 "[SCOPE.sC('target_country').GetName] стал[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] #b подданным государством#!, и это изменение напрямую затрагивает структуру и независимость его денежной системы.\n\nКак следствие нового политического статуса национальная валюта теперь #b приведена в соответствие с денежным стандартом сюзерена#!. Местная конвертируемость больше не поддерживается; вместо этого любой обмен на драгоценные металлы или иностранные валюты теперь должен осуществляться #b исключительно через финансовые учреждения сюзерена#!.\n\nЭтот сдвиг отражает историческую реальность зависимых государств: утрату денежного суверенитета и включение их валюты в доминирующую фискально-финансовую систему контролирующей державы.\n\nДоступ страны к международным рынкам теперь полностью опосредован её сюзереном."
 00_ef_economic_event.28.a:0 "Признать новую зависимость"

#notif
# 00_ef_economic_event_28
  notification_00_ef_economic_event_28_message_tooltip: "#header $notification_00_ef_economic_event_28_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_28_message_desc$"
  notification_00_ef_economic_event_28_message_name: "[SCOPE.sC('target_country').GetName] теряет денежную самостоятельность"
  notification_00_ef_economic_event_28_message_desc: "[SCOPE.sC('target_country').GetName] стал[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] #b подданным государством#!, и это изменение напрямую затрагивает структуру и независимость его денежной системы.\n\nКак следствие нового политического статуса национальная валюта теперь #b приведена в соответствие с денежным стандартом сюзерена#!. Местная конвертируемость больше не поддерживается; вместо этого любой обмен на драгоценные металлы или иностранные валюты теперь должен осуществляться #b исключительно через финансовые учреждения сюзерена#!."

 00_ef_economic_event.29.t:0 "[SCOPE.sC('target_country').GetName] возвращает денежную независимость"
 00_ef_economic_event.29.d:0 "Восстановление национальной конвертируемости"
 00_ef_economic_event.29.f:0 "Освободившись от прежнего подчинения, [SCOPE.sC('target_country').GetName] восстановил[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] полный #b денежный суверенитет#!. С окончанием зависимого статуса страна больше не связана денежной системой своего бывшего сюзерена.\n\nВ результате её валюта снова становится #b непосредственно конвертируемой#!, и её можно обменивать на иностранные валюты и драгоценные металлы без посреднических операций через другую державу. Это означает возвращение к #b самостоятельной денежно-кредитной политике#! и восстанавливает способность страны проводить международные финансовые операции на собственных условиях.\n\nВосстановление конвертируемости укрепляет национальную надёжность и вновь открывает доступ к независимому участию в мировых рынках."
 00_ef_economic_event.29.a:0 "Новая эпоха денежной независимости"

#notif 
# 00_ef_economic_event_29
  notification_00_ef_economic_event_29_message_tooltip: "#header $notification_00_ef_economic_event_29_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_29_message_desc$"
  notification_00_ef_economic_event_29_message_name: "[SCOPE.sC('target_country').GetName] возвращает денежную независимость"
  notification_00_ef_economic_event_29_message_desc: "Освободившись от прежнего подчинения, [SCOPE.sC('target_country').GetName] восстановил[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] полный #b денежный суверенитет#!. С окончанием зависимого статуса страна больше не связана денежной системой своего бывшего сюзерена.\n\nВ результате её валюта снова становится #b непосредственно конвертируемой#!, и её можно обменивать на иностранные валюты и драгоценные металлы без посреднических операций через другую державу. Это означает возвращение к #b самостоятельной денежно-кредитной политике#! и восстанавливает способность страны проводить международные финансовые операции на собственных условиях."

 00_ef_economic_event.30.t:0 "[SCOPE.sC('target_country').GetName] отказывается от металлической конвертируемости"
 00_ef_economic_event.30.d:0 "Переход на фиатный денежный стандарт"
 00_ef_economic_event.30.f:0 "Столкнувшись с тяжёлой денежной нестабильностью, [SCOPE.sC('target_country').GetName] принял[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] чрезвычайные меры, которые приостанавливают все формы металлической конвертируемости и переводят национальную валюту на #b фиатный стандарт#!.\n\nПо мере обрушения доверия валюта теперь считается имеющей ценность лишь благодаря #b бумаге, на которой она напечатана#!. Не имея обеспечения золотом или серебром, иностранные торговцы отказываются её принимать, что приводит к #b блокированию всех торговых путей#!, зависящих от национальной валюты.\n\nМеждународные расчёты в этой валюте больше невозможны, и жизнеспособными остаются лишь прямой бартер или расчёты в иностранной валюте. Это означает резкий переход к хрупкой, поддерживаемой государством денежной системе, навязанной необходимостью, а не стабильностью."
 00_ef_economic_event.30.a:0 "Признать денежный крах"

00_ef_economic_event.31.t:0 "Девальвация стандарта [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')]"
00_ef_economic_event.31.d:0 "[SCOPE.sC('target_country').GetName] снижает металлический стандарт"
00_ef_economic_event.31.f:0 "Парламент [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] принял реформу, #b девальвирующую металлический стандарт страны#! — то есть снижающую юридически установленную металлическую стоимость, обеспечивающую национальную валюту.\n\nОфициальный паритет [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')] меняется с\n #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1_old').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#!\n на #b девальвированный#! уровень\n #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#!.\n\nЭта мера представляет собой #b понижающий пересмотр юридического металлического коэффициента конверсии#!, уменьшая подразумеваемое содержание металла на единицу валюты. Однако #b фактическое соотношение конверсии#! по-прежнему зависит от реальных резервов центрального банка и может существенно расходиться с новым юридическим паритетом.\n\nПодобные девальвации часто вводятся, чтобы ослабить давление на металлические резервы, поглотить денежные дисбалансы или адаптироваться к неблагоприятным изменениям мировых цен на металлы. Однако они также могут ослабить доверие к валюте, если участники рынка сочтут корректировку недостаточной или политически мотивированной."
00_ef_economic_event.31.a:0 "Провести девальвацию"

00_ef_economic_event.32.t:0 "Ревальвация стандарта [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')]"
00_ef_economic_event.32.d:0 "[SCOPE.sC('target_country').GetName] повышает металлический стандарт"
00_ef_economic_event.32.f:0 "Парламент [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] принял реформу, #b ревальвирующую металлический стандарт страны#! — то есть увеличивающую юридически установленную металлическую стоимость, обеспечивающую национальную валюту.\n\nОфициальный паритет [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')] повышается с\n #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1_old').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#!\n до #b ревальвированного#! уровня\n #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#!.\n\nЭта мера представляет собой #b повышающий пересмотр юридического металлического коэффициента конверсии#!, увеличивая подразумеваемое содержание металла на единицу валюты. Однако #b фактическое соотношение конверсии#! по-прежнему зависит от реальных резервов центрального банка и может существенно расходиться с новым юридическим паритетом.\n\nПодобные ревальвации часто вводятся, чтобы укрепить доверие к валюте, сдержать инфляцию или отразить улучшение условий по металлическим резервам. Однако они также могут создавать напряжённость в торговых или кредитных рынках, если корректировка будет сочтена чрезмерной или слишком резкой."
00_ef_economic_event.32.a:0 "Провести ревальвацию"


 00_ef_economic_event.33.t:0 "[SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')] становится мировой резервной валютой"
 00_ef_economic_event.33.d:0 "Новый международный ориентир"
 00_ef_economic_event.33.f:0 "Обладая крупнейшими в мире запасами драгоценных металлов, #v [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')]#! из [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] теперь обеспечивает самую глубокую и стабильную денежную основу на мировых рынках. В результате национальная валюта стала #b мировой резервной валютой#!.\n\nОгромный объём металлических резервов, обеспечивающих валюту, даёт ей исключительную #b глубину рынка#! и позволяет иностранным государствам, торговцам и финансовым учреждениям повсеместно использовать её для расчётов, оценок и международной торговли.\n\nЭто развитие отражает историческую закономерность, при которой валюта государства с самыми сильными резервами и наивысшей финансовой надёжностью естественным образом становится предпочтительным #b глобальным средством обмена#!."
 00_ef_economic_event.33.a:0 "Появляется новый мировой денежный лидер"

 00_ef_economic_event.34.t:0 "[SCOPE.sC('target_country').GetName] становится мировой финансовой державой"
 00_ef_economic_event.34.d:0 "Доминирование на международных рынках капитала"
 00_ef_economic_event.34.f:0 "Обладая крупнейшей в мире совокупной капитализацией фондового рынка, [SCOPE.sC('target_country').GetName] теперь выступает в роли #b мировой финансовой державы#!. Её финансовые рынки, поддерживаемые огромной ликвидностью и высокой инвестиционной активностью, обеспечивают непревзойдённую #b глубину рынка#!, #b кредитную ёмкость#! и #b мобильность капитала#!.\n\nВедущая фондовая биржа страны стала главным центром мировых инвестиционных потоков, влияя на процентные ставки, доступность кредитов и спекулятивные движения через границы.\n\nИсторически страна, чьи финансовые рынки привлекают наибольший международный капитал, естественным образом принимает роль #b глобального финансового узла#!, формируя мировые экономические тенденции и служа доминирующим центром современной финансовой системы."
 00_ef_economic_event.34.a:0 "Признать возвышение финансового титана"

 00_ef_economic_event.35.t:0 "Золото принято в качестве универсального эталонного стандарта"
 00_ef_economic_event.35.d:0 "Глобальный ориентир для сравнения валют"
 00_ef_economic_event.35.f:0 "Хотя лишь ограниченное число государств официально использует золотой стандарт, превращение [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] в #b мировую резервную валюту#! подтолкнуло международное сообщество принять #b золото#! в качестве универсального ориентира для сравнения стоимости всех валют.\n\nЭто решение стало возможным благодаря мировому ценовому соотношению между #b серебром и золотом#!, которое позволяет даже валютам, основанным на серебре или полностью серебряным, выражаться через их золотой эквивалент. В результате теперь каждую национальную валюту можно оценивать по единой шкале, независимо от её базового денежного стандарта.\n\nУстановив золото как универсальный эталон, финансовые учреждения и правительства получают единый метод измерения силы валют, оценки международной конкурентоспособности и мониторинга трансграничных потоков капитала. Это фундаментальный шаг к более согласованному и интегрированному мировому денежному порядку."
 00_ef_economic_event.35.a:0 "Принять универсальный золотой эталон"







