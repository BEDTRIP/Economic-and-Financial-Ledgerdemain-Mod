  00_ef_economic_event.95.t:0 "Частные банки нацеливаются на золотые резервы" 
  00_ef_economic_event.95.d:0 "В операции участвует крупный частный банк: [SCOPE.sCompany('arbitrage_privat_bank').GetName]."  
  00_ef_economic_event.95.f:0 "Проводится скоординированная арбитражная операция.\n\nПеречисленные частные банки начали использовать установленное законом биметаллическое соотношение, атакуя стоимость [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')] путём оттока #v золотых резервов#! @gold! страны через крупномасштабный арбитраж.\n\n Приток #p [SCOPE.sC('target_country').MakeScope.Var('silver_state_1_fix').GetValue|D]#! @silver! и отток #n -[SCOPE.sC('target_country').MakeScope.Var('gold_state_1_fix').GetValue|D]#! @gold!.\n\nЕсли это продолжится, несоответствие между законным соотношением и мировой ценой золота вызовет серьёзную денежную нестабильность." 
  00_ef_economic_event.95.a:0 "Следить за утечкой золота"
   
  00_ef_economic_event.96.t:0 "Частные банки нацеливаются на серебряные резервы" 
  00_ef_economic_event.96.d:0 "В операции участвует крупный частный банк: [SCOPE.sCompany('arbitrage_privat_bank').GetName]."  
  00_ef_economic_event.96.f:0 "Проводится скоординированная арбитражная операция.\n\nПеречисленные частные банки начали использовать установленное законом биметаллическое соотношение, атакуя стоимость [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')] путём оттока #v серебряных резервов#! @Silver! страны через крупномасштабный арбитраж.\n\n Приток #p [SCOPE.sC('target_country').MakeScope.ScriptValue('gold_gained')|D=]#! @gold! и отток #n -[SCOPE.sC('target_country').MakeScope.ScriptValue('silver_lost')|D]#! @silver!.\n\n Если это продолжится, несоответствие между законным соотношением и мировой ценой серебра вызовет серьёзную денежную нестабильность." 
  00_ef_economic_event.96.a:0 "Следить за утечкой серебра"
 
  notification_00_ef_economic_event_30_message_tooltip:0 "#header $notification_00_ef_economic_event_30_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_30_message_desc$"
  notification_00_ef_economic_event_30_message_name:0 "[SCOPE.sC('target_country').GetName] отказывается от размена на металл"
  notification_00_ef_economic_event_30_message_desc:0 "Столкнувшись с тяжёлой денежной нестабильностью, [SCOPE.sC('target_country').GetName] ввела чрезвычайные меры, которые приостанавливают любой размен валюты на металл и переводят национальную валюту на #b фиатный стандарт#!."

  notification_00_ef_economic_event_26_message_tooltip:0 "#header $notification_00_ef_economic_event_26_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_26_message_desc$"
  notification_00_ef_economic_event_26_message_name:0 "Введение биметаллического стандарта в [SCOPE.sC('target_country').GetAltName('RU_CL_PP')]"
  notification_00_ef_economic_event_26_message_desc:0 "Стремясь укрепить денежную стабильность, [SCOPE.sC('target_country').GetName] принял[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] ряд финансовых мер, вводящих #b биметаллический стандарт#! и дающих полный размен национальной валюты как на #b золото#!, так и на #b серебро#!."

  notification_00_ef_economic_event_27_message_tooltip:0 "#header $notification_00_ef_economic_event_27_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_27_message_desc$"
  notification_00_ef_economic_event_27_message_name:0 "Введение золотого стандарта в [SCOPE.sC('target_country').GetAltName('RU_CL_PP')]"
  notification_00_ef_economic_event_27_message_desc:0 "Стремясь укрепить денежную стабильность и полнее встроиться в международные финансовые рынки, [SCOPE.sC('target_country').GetName] принял[SCOPE.sC('target_country').GetAltNameNoFormatting('RU_CL_END_FEM')] новое финансовое законодательство, вводящее #b золотой стандарт#!."

  notification_00_ef_economic_event_31_message_tooltip:0 "#header $notification_00_ef_economic_event_31_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_31_message_desc$"
  notification_00_ef_economic_event_31_message_name:0 "Девальвация стандарта [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')]"
  notification_00_ef_economic_event_31_message_desc:0 "Парламент [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] провёл реформу, #b девальвирующую металлический стандарт страны#! — то есть понижающую законодательно установленное металлическое содержание, обеспечивающее национальную валюту.\n\nОфициальный паритет [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')] меняется с #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1_old').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#! на #b девальвированный#! уровень #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#!."

#\n\nThis measure represents a #b downward revision of the legal metal conversion value#!, reducing the metal content implied per unit of currency. The #b real conversion ratio#!, however, continues to depend on the central bank’s actual reserves and may diverge significantly from the new legal parity.\n\nSuch devaluations are often introduced to ease pressure on metal reserves, absorb monetary imbalances, or adapt to adverse global metal price movements. Yet they may also weaken the credibility of the currency if market participants judge the adjustment insufficient or politically motivated."

  notification_00_ef_economic_event_32_message_tooltip:0 "#header $notification_00_ef_economic_event_32_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_32_message_desc$"
  notification_00_ef_economic_event_32_message_name:0 "Ревальвация стандарта [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')]"
  notification_00_ef_economic_event_32_message_desc:0 "Парламент [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] провёл реформу, #b ревальвирующую металлический стандарт страны#! — то есть повышающую законодательно установленное металлическое содержание, обеспечивающее национальную валюту.\n\n Официальный паритет [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')] растёт с #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1_old').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#! до #b ревальвированного#! уровня #b 1 [SCOPE.sC('target_country').GetCustom('currency_symbol')] = [SCOPE.sC('target_country').MakeScope.Var('money_value_target_1').GetValue] [SCOPE.sC('target_country').GetCustom('monetary_system')]#!."

#\n\nThis measure represents an #b upward revision of the legal metal conversion value#!, increasing the metal content implied per unit of currency. The #b real conversion ratio#!, however, continues to depend on the central bank’s actual reserves and may diverge significantly from the new legal parity.\n\nSuch revaluations are often introduced to strengthen currency credibility, curb inflation, or reflect improved metal reserve conditions. Yet they may also create tensions in trade or credit markets if the adjustment is judged excessive or abrupt."

  notification_00_ef_economic_event_95_message_tooltip:0 "#header $notification_00_ef_economic_event_95_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_95_message_desc$"
  notification_00_ef_economic_event_95_message_name:0 "Частные банки атакуют золотые резервы"
  notification_00_ef_economic_event_95_message_desc:0 "Идёт согласованная арбитражная операция.\n\nПеречисленные частные банки начали пользоваться установленным законом биметаллическим соотношением: они бьют по стоимости [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')], выкачивая #v золотые резервы#! @gold! страны через крупномасштабный арбитраж.\n\n Приток #p [SCOPE.sC('target_country').MakeScope.Var('silver_state_1_fix').GetValue|D]#! @silver! и отток #n -[SCOPE.sC('target_country').MakeScope.Var('gold_state_1_fix').GetValue|D]#! @gold!.\n\nЕсли это продолжится, расхождение между законным соотношением и мировой ценой золота вызовет тяжёлую денежную нестабильность."

  notification_00_ef_economic_event_96_message_tooltip:0 "#header $notification_00_ef_economic_event_96_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_96_message_desc$"
  notification_00_ef_economic_event_96_message_name:0 "Частные банки атакуют серебряные резервы"
  notification_00_ef_economic_event_96_message_desc:0 "Идёт согласованная арбитражная операция.\n\nПеречисленные частные банки начали пользоваться установленным законом биметаллическим соотношением: они бьют по стоимости [SCOPE.sC('target_country').GetCustom('currency_name')] [SCOPE.sC('target_country').GetCustom('currency_symbol')], выкачивая #v серебряные резервы#! @Silver! страны через крупномасштабный арбитраж.\n\n Приток #p [SCOPE.sC('target_country').MakeScope.ScriptValue('gold_gained')|D=]#! @gold! и отток #n -[SCOPE.sC('target_country').MakeScope.ScriptValue('silver_lost')|D]#! @silver!.\n\n Если это продолжится, расхождение между законным соотношением и мировой ценой серебра вызовет тяжёлую денежную нестабильность."

  notification_00_ef_economic_event_1_message_tooltip:0 "#header $notification_00_ef_economic_event_1_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_00_ef_economic_event_1_message_desc$"
  notification_00_ef_economic_event_1_message_name:0 "Новый центральный банк и национальная валюта в [SCOPE.sC('target_country').GetAltName('RU_CL_PP')]"
  notification_00_ef_economic_event_1_message_desc:0 "Правительство [SCOPE.sC('target_country').GetAltName('RU_CL_RP')] официально объявило об учреждении современного центрального банка и о введении новой национальной валюты: [SCOPE.sC('target_country').GetCustom('currency_name')]#! [SCOPE.sC('target_country').GetCustom('currency_symbol')]."

 
00_ef_economic_event.106.t:0 "Денежный дисбаланс"
00_ef_economic_event.106.d:0 "Политическое давление нарастает"
00_ef_economic_event.106.f:0 "Доля металлического покрытия центрального банка опустилась ниже 75% или поднялась выше 125%, опасно отойдя от целевого уровня. Доверие к нынешнему денежному устройству слабеет, и [concept_interest_group] по всей стране всё настойчивее требуют широких денежных реформ. [SCOPE.gsInterestGroup('ig_want_a_large_monetary_policy').GetName] может принять идеологию [GetIdeology('ideology_monetary_policy').GetName], усилив поддержку принятия закона [GetLawType('law_large_monetary_policy').GetName]."
00_ef_economic_event.106.a:0 "Спор разгорается."

00_ef_economic_event.107.t:0 "Денежная стабильность"
00_ef_economic_event.107.d:0 "Доверие восстановлено"
00_ef_economic_event.107.f:0 "Доля металлического покрытия центрального банка вернулась к приемлемым значениям, восстановив доверие к денежному устройству страны. Валюта вновь держится в намеченных границах, и поддержка чрезвычайных денежных мер сходит на нет. [SCOPE.gsInterestGroup('ig_want_a_large_monetary_policy').GetName] может отказаться от идеологии [GetIdeology('ideology_monetary_policy').GetName], снизив поддержку принятия закона [GetLawType('law_large_monetary_policy').GetName]."
00_ef_economic_event.107.a:0 "Стабильность возвращается."
