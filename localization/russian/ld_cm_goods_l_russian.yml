 # R8б.6: the investment fund (Д.R8б.6, Д.П.3 -- the texts of the concept «Инвестиционный фонд»)
 building_ld_investment_fund:0 "Инвестиционный фонд"
 building_ld_investment_fund_desc:0 "Инвестиционный фонд собирает деньги пайщиков и вкладывает их в требования — чужие деньги, облигации, акции. Пайщики — население и банки — покупают его паи и делят между собой его прибыль и убытки. Управляют фондом капиталисты и компании, владеющие его зданием рядом с биржей; уровни здания определяют, сколько требований фонд может держать. На бирже фонд работает дилером: на каждый актив у него две цены, покупки и продажи; чем выше ключевая ставка в его стране, тем шире разница."
 pmg_zz_ef_bank_funds:0 "Паи фондов"
 pm_zz_ef_bank_no_funds:0 "Без паёв фондов"
 pm_zz_ef_bank_funds:0 "Паи фондов"
 pm_zz_ef_bank_funds_desc:0 "Банки вкладывают часть денег в паи инвестиционного фонда своей биржи. Включается, когда на рынке продаются паи фонда."
