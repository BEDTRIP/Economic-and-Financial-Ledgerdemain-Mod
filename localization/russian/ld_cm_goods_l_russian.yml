 # R8б.6: the investment fund (Д.R8б.6, Д.П.3 -- the texts of the concept «Инвестиционный фонд»)
 building_ld_investment_fund:0 "Инвестиционный фонд"
 building_ld_investment_fund_desc:0 "Инвестиционный фонд собирает деньги пайщиков и вкладывает их в требования — чужие деньги, облигации, акции. Пайщики — население и банки — покупают его паи и делят между собой его прибыль и убытки. Управляют фондом капиталисты и компании, владеющие его зданием рядом с биржей; уровни здания определяют, сколько требований фонд может держать. Население платит за паи из вкладов, банки — из своих средств; деньги фонда лежат вкладом в банках страны биржи и приносят проценты по вкладам, а при учреждении фонда банки вкладывают в него десятую часть своего капитала. Каждый уровень здания позволяет держать требований на 100 000. На бирже фонд работает дилером: на каждый актив у него две цены, покупки и продажи, не дальше 2 % от справедливой; разница — половина ключевой ставки в его стране. Он забирает несведённый остаток стакана и мелкие позиции держателей и отрабатывает расхождение законного соотношения биметаллизма с мировой ценой металлов."
 pmg_zz_ef_bank_funds:0 "Паи фондов"
 pm_zz_ef_bank_no_funds:0 "Без паёв фондов"
 pm_zz_ef_bank_funds:0 "Паи фондов"
 pm_zz_ef_bank_funds_desc:0 "Банки вкладывают часть денег в паи инвестиционного фонда своей биржи. Включается, когда на рынке продаются паи фонда."
 pmg_zz_ef_bank_bonds:0 "Облигации"
 pm_zz_ef_bank_no_bonds:0 "Без облигаций"
 pm_zz_ef_bank_bonds:0 "Облигации"
 pm_zz_ef_bank_bonds_desc:0 "Банки выпускают облигации для центрального банка: выпуск страны растёт с размером центрального банка и государственным долгом."
