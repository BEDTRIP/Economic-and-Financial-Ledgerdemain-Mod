l_german:
 notification_zz_ef_panic_start_name:0 "Bank Panic"
 notification_zz_ef_panic_start_desc:0 "Trust in money has collapsed: [GetPlayer.MakeScope.ScriptValue('zz_ef_trust_v')|%0]. People are drawing their deposits out of the banks as cash, three times faster than usual, until trust returns."
 notification_zz_ef_panic_start_tooltip:0 "#header $notification_zz_ef_panic_start_name$#!\n$TOOLTIP_DELIMITER$\n$notification_zz_ef_panic_start_desc$"
 notification_zz_ef_panic_end_name:0 "Bank Panic Over"
 notification_zz_ef_panic_end_desc:0 "Trust in money has recovered: [GetPlayer.MakeScope.ScriptValue('zz_ef_trust_v')|%0]. Deposits and cash move at the usual pace again."
 notification_zz_ef_panic_end_tooltip:0 "#header $notification_zz_ef_panic_end_name$#!\n$TOOLTIP_DELIMITER$\n$notification_zz_ef_panic_end_desc$"
