# Deliberate omissions for `v3 audit stale <mod> --declared v3-audit.toml` (R9б closure check): full bodies that leave
# out fields vanilla has, on purpose. A new finding is either fixed or declared here with its reason.

[[declared]]
folder = "common/building_groups"
key = "bg_construction"
fields = ["is_government_funded", "lens", "urbanization"]
why = "PSC: the construction sector is private infrastructure (bg_private_infrastructure), not funded by the government; the lens and urbanization come with the private group"

[[declared]]
folder = "common/buildings"
key = "building_construction_sector"
fields = ["has_max_level"]
why = "PSC: private construction sectors are not capped by the state's level limit"

[[declared]]
