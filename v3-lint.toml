# v3 lint of the fork: what the baseline knew, sorted out 16.10.2026 (`v3 lint --triage`).
# `why` — noise, with the reason; `plan` — a real problem, tracked in этапы/R12.md, section «Линт» (Л.N).
# Evidence for "the game accepts it": a run of 16.10 (r1016_070354, -debug_mode) logged no error in any file of the
# fork at load — the 23 located errors are all CMF and vanilla files.

# --- noise: tiger does not know 1.13 or the engine ---------------------------------------------------------------

[[suppress]]
key = "missing-item"
message = "building type building_company_"
why = "the engine makes a building_company_<key> type for every company type (company_<key> is defined); the game logs nothing about them"

[[suppress]]
key = "validation"
message = "variable_map"
why = "1.13 variable maps (variable_map:, variable_map(...)); the game loads them without error"

[[suppress]]
key = "validation"
message = "`variable = ` is only for"
why = "1.13 takes variable = in any_/ordered_/random_in_list; the game loads it without error"

[[suppress]]
key = "unknown-field"
file = "common/script*"
why = "1.13 effects and values tiger does not know (create_container, destroy_container, market_exports, market_imports); the game loads them without error"

[[suppress]]
key = "scopes"
file = "common/scripted_guis/*"
why = "a scripted GUI's scope comes from the window that calls it; tiger sees none and guesses"

[[suppress]]
key = "scopes"
file = "common/scripted_effects/ld_clearing.txt"
why = "variable maps hold values and countries by design; tiger deduces one type per list"

[[suppress]]
key = "scopes"
file = "common/scripted_effects/08_list_effect.txt"
why = "variable lists of companies sorted by value; tiger deduces the list as countries from its first use"

[[suppress]]
key = "scopes"
file = "common/history/*"
why = "history effects run in the scope the history file gives; tiger sees none"

[[suppress]]
key = "datafunctions"
message = "GetSearchBar"
why = "vanilla uses MarketPanel.GetSearchBar too (building_browser_panel.gui, politics_panel.gui)"

